<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foco">
<meta name="theme-color" content="#F4F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Foco</title>
<style>
:root{
  --bg:#F4F5F9; --sf:#FFFFFF; --sf2:#ECEEF4; --sf3:#E0E4EE;
  --ink:#10152A; --mut:#535D77; --mut2:#8C95AB; --ln:rgba(16,21,42,.08); --ln2:rgba(16,21,42,.16);
  --ac:#5856E8; --ac2:#8B5CF6; --ac-s:#ECEBFE; --ac-t:#4442C8; --on-ac:#FFFFFF;
  --ok:#0B8F63; --ok-s:#E1F4EB; --hot:#D93A52; --hot-s:#FCEAED; --warn:#A35F00; --warn-s:#FBF0DA; --vio:#7444E0; --vio-s:#F0EAFD;
  --glow:0 0 0 1.5px var(--ac),0 12px 30px -14px rgba(88,86,232,.55);
  --float:0 14px 34px -12px rgba(16,21,42,.35);
  --r:18px; --top:max(env(safe-area-inset-top),10px); --bot:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1120; --sf:#131A2B; --sf2:#1A2236; --sf3:#252E46;
  --ink:#E7EBF6; --mut:#A4ADC4; --mut2:#6B7691; --ln:rgba(255,255,255,.07); --ln2:rgba(255,255,255,.14);
  --ac:#8F8DFF; --ac2:#B08CFF; --ac-s:rgba(143,141,255,.15); --ac-t:#BAB9FF; --on-ac:#0B1120;
  --ok:#3DD6A0; --ok-s:rgba(61,214,160,.14); --hot:#FF7489; --hot-s:rgba(255,116,137,.14); --warn:#F5B142; --warn-s:rgba(245,177,66,.14); --vio:#B596FF; --vio-s:rgba(181,150,255,.15);
  --glow:0 0 0 1px rgba(143,141,255,.6),0 0 34px -8px rgba(143,141,255,.45);
  --float:0 16px 40px -10px rgba(0,0,0,.75);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html.lock,html.lock body{overflow:hidden}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button,a,input,textarea,select,label,summary,[data-a]{touch-action:manipulation}
[data-a]{cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}
.mut{color:var(--mut)} .sm{font-size:13px} .hide{display:none!important} .sp{flex:1}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}

/* Encabezado */
#hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:4px;padding:calc(var(--top) + 8px) 10px 10px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
#hdr .tt{flex:1;min-width:0}
#hTitle{margin:0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.025em}
#hSub{margin:2px 0 0;font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--mut);position:relative;flex:none;transition:background .15s}
.ib:active{background:var(--sf2)}
.syncdot{position:absolute;top:10px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--mut2);border:2px solid var(--bg)}
.syncdot.ok{background:var(--ok)}.syncdot.pend{background:var(--warn)}.syncdot.err{background:var(--hot)}
.syncdot.run{background:var(--ac);animation:pulse 1s infinite}
.streak{height:34px;margin-right:2px;padding:0 10px 0 8px;border-radius:17px;background:var(--warn-s);color:var(--warn);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:3px;flex:none}
.streak svg.i{width:17px;height:17px;stroke-width:2.2}

main{padding:4px 16px calc(150px + var(--bot))}
.view{display:none}
.view.on{display:block;animation:vin .25s var(--ease)}

/* Barra inferior */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;padding:6px 4px calc(6px + var(--bot));background:color-mix(in srgb,var(--sf) 88%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--ln)}
#tabs button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--mut);position:relative;transition:color .2s;text-align:center}
#tabs .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s var(--ease)}
#tabs .pill svg.i{width:22px;height:22px}
#tabs button.on{color:var(--ac-t)}
#tabs button.on .pill{background:var(--ac-s)}
#tabs .bdg{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hot);color:#fff;font-size:11px;line-height:18px;font-weight:800}
#tabs .tdot{position:absolute;top:6px;left:calc(50% + 12px);width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}

/* Botón de captura flotante */
#fab{position:fixed;right:16px;bottom:calc(78px + var(--bot));z-index:44;height:52px;padding:0 20px 0 16px;border-radius:18px;background:var(--ac);color:var(--on-ac);display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:15px;box-shadow:var(--float);transition:transform .2s var(--ease),bottom .3s var(--ease)}
#fab:active{transform:scale(.95)}
#fab svg.i{width:22px;height:22px;stroke-width:2.2}
body.has-mini #fab{bottom:calc(142px + var(--bot))}

/* Piezas base */
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.group{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.sec-t{display:flex;align-items:center;gap:8px;margin:24px 4px 10px;font-size:13.5px;font-weight:750;color:var(--mut)}
.sec-t svg.i{width:17px;height:17px}
.sec-t .n{font-weight:750;color:var(--mut);background:var(--sf2);border-radius:8px;padding:0 7px;font-size:12px;line-height:20px}
.hint{color:var(--mut);font-size:13.5px;margin:10px 4px 0;line-height:1.5}
.hint svg.i{width:15px;height:15px;vertical-align:-3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:19px;background:var(--sf2);color:var(--mut);font-size:14px;font-weight:650;white-space:nowrap;flex:none;transition:background .18s,color .18s,transform .12s}
.chip svg.i{width:16px;height:16px}
.chip:active{transform:scale(.96)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--a,var(--mut2))}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.area.on{background:var(--a);color:#fff}
.chip.area.on .dot{background:#fff}
.chip:disabled{opacity:.4}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a,var(--mut2));flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag svg.i{width:14px;height:14px;stroke-width:2.1}
.tag.q1{color:var(--hot)}.tag.q2{color:var(--ac-t)}.tag.q3{color:var(--warn)}.tag.a{color:var(--ink)}
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:14.5px;font-weight:700;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s var(--ease)}
.seg button svg.i{width:17px;height:17px}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{min-height:46px;padding:0 18px;border-radius:14px;background:var(--sf2);color:var(--ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn svg.i{width:18px;height:18px}
.btn.pri{background:var(--ac);color:var(--on-ac)}
.btn.okb{background:var(--ok-s);color:var(--ok)}
.btn.ghost{background:transparent;border:1px solid var(--ln2)}
.btn.danger{color:var(--hot)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.sq{width:46px;padding:0;flex:none}
.btn.grow{flex:1}
.btn.full{width:100%}
.in{width:100%;min-height:46px;background:var(--sf2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;outline:none;transition:border .2s}
.in:focus{border-color:var(--ac)}
textarea.in{resize:none}
.empty{text-align:center;color:var(--mut);padding:24px 12px;font-size:14px}
.zero{text-align:center;padding:28px 16px}
.zero .orb{width:80px;height:80px;margin:0 auto 12px;border-radius:50%;background:var(--ok-s);color:var(--ok);display:grid;place-items:center}
.zero .orb.ac{background:var(--ac-s);color:var(--ac-t)}
.zero .orb svg.i{width:36px;height:36px;stroke-width:2.1}
.zero h3{margin:0;font-size:18px;font-weight:800}
.zero p{margin:6px auto 0;color:var(--mut);font-size:14px;max-width:290px}
.in-anim{animation:popin .35s var(--ease)}
.row-link{width:100%;display:flex;align-items:center;gap:12px;margin-top:12px;min-height:56px;color:var(--ink)}
.row-link > span{flex:1}
.row-link b{font-weight:750}
.row-link > svg.i:first-child{color:var(--ac-t)}
.row-link > svg.i:last-child{color:var(--mut2)}

/* Filas de tarea */
.tr{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 6px 10px 16px;background:var(--sf);transition:opacity .3s,transform .3s var(--ease),background .15s;color:var(--ink)}
.tr + .tr{border-top:1px solid var(--ln)}
.tr::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--a,transparent)}
.tr:active{background:var(--sf2)}
.tb{flex:1;min-width:0}
.tt{font-weight:650;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.mt:empty{display:none}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ln2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mut);transition:all .25s var(--ease);position:relative}
.ck svg.i{width:16px;height:16px;stroke-width:3;position:absolute;inset:0;margin:auto;opacity:0;transform:scale(.4);transition:all .25s var(--ease);color:#fff}
.ck:active{transform:scale(.9)}
.done .ck,.ck.on{background:var(--ok);border-color:var(--ok)}
.done .ck span,.ck.on span{opacity:0}
.done .ck svg.i,.ck.on svg.i{opacity:1;transform:none}
.tr.done .tt{text-decoration:line-through;color:var(--mut)}
.tr.out{opacity:0;transform:translateX(24px)}
.tr.hecha .tt{text-decoration:line-through;color:var(--mut)}
.grip{width:44px;height:48px;display:grid;place-items:center;color:var(--mut2);flex:none;touch-action:none;cursor:grab}
.grip svg.i{width:18px;height:18px}
.ib-s{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut2);flex:none}
.ib-s svg.i{width:19px;height:19px}

/* Arrastre */
[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed!important;z-index:1000;pointer-events:none;margin:0!important;transform:rotate(1.2deg) scale(1.03);box-shadow:var(--float)!important;border-radius:16px;opacity:.97;transition:none}
.ph{opacity:.3;outline:2px dashed var(--mut2);outline-offset:-3px}
.lift{z-index:20;box-shadow:var(--float)!important;transform:scale(1.02)}
body.dragging{cursor:grabbing}

/* Bandeja */
.cap{padding:6px;border-radius:22px}
.cap textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;padding:12px 12px 6px;font-size:17px;line-height:1.4;min-height:76px;max-height:200px}
.cap textarea::placeholder{color:var(--mut2)}
.cap-bar{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 6px}
.cap-bar .chips{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cap-bar .chips::-webkit-scrollbar{display:none}
.cap-bar .chip{min-height:36px;padding:0 12px;font-size:13.5px}
.cap-send{width:46px;height:46px;border-radius:15px;background:var(--ac);color:var(--on-ac);display:grid;place-items:center;flex:none;transition:transform .12s}
.cap-send:active{transform:scale(.9)}
.cap-send svg.i{stroke-width:2.3}
.tips{margin:8px 4px 0;font-size:13.5px;color:var(--mut)}
.tips summary{list-style:none;display:inline-flex;align-items:center;gap:6px;font-weight:650;min-height:40px}
.tips summary::-webkit-details-marker{display:none}
.tips summary svg.i{width:16px;height:16px}
.tips[open] .chev{transform:rotate(180deg)}
.tips div{padding:0 0 4px;line-height:1.6}
.tips b{color:var(--ink)}
.chev{transition:transform .2s}
.cta{width:100%;margin-top:18px;min-height:66px;padding:12px 14px;border-radius:18px;background:var(--ac);color:var(--on-ac);display:flex;align-items:center;gap:12px;text-align:left;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta > span:not(.ico){flex:1}
.cta b{display:block;font-size:16px}
.cta small{font-size:13px;opacity:.85}
.cta .ico{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.conn{display:flex;align-items:center;gap:12px;margin-top:18px}
.conn .ci{width:40px;height:40px;border-radius:12px;background:var(--ac-s);color:var(--ac-t);display:grid;place-items:center;flex:none}
.conn b{font-size:14.5px}

/* Procesar */
#proc{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--top) + 4px) 16px calc(16px + var(--bot));overflow-y:auto;overscroll-behavior:contain}
#proc.on{display:flex;animation:vin .25s var(--ease)}
.proc-top{display:flex;align-items:center;gap:10px}
.proc-prog{flex:1;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.proc-prog div{height:100%;background:var(--ac);border-radius:3px;transition:width .4s var(--ease)}
.proc-n{font-size:13.5px;font-weight:750;color:var(--mut);min-width:40px;text-align:right}
.proc-card{margin:18px 0 16px;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:18px;transition:transform .32s var(--ease),opacity .32s}
.proc-card.enter{animation:penter .38s var(--ease)}
@keyframes penter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.proc-card.fly-right{transform:translateX(120%) rotate(8deg);opacity:0}
.proc-card.fly-left{transform:translateX(-120%) rotate(-8deg);opacity:0}
.proc-card.fly-up{transform:translateY(-80%) scale(.9);opacity:0}
.proc-q{font-size:12.5px;font-weight:800;color:var(--ac-t);letter-spacing:.05em;text-transform:uppercase}
.proc-tt{width:100%;border:0;outline:0;background:none;resize:none;font-size:22px;font-weight:750;line-height:1.28;letter-spacing:-.01em;margin-top:8px;padding:0}
.proc-meta{font-size:13.5px;color:var(--mut);margin-top:6px}
.two{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--ok-s);color:var(--ok);text-align:left;min-height:74px;transition:transform .12s}
.two:active{transform:scale(.98)}
.two .ico{width:46px;height:46px;border-radius:14px;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.two > span:nth-child(2){flex:1}
.two b{display:block;font-size:16px;color:var(--ink)}
.two small{font-size:13.5px;color:var(--mut)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:118px;transition:transform .12s}
.act:active{transform:scale(.96)}
.act .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--k-s);color:var(--k)}
.act b{display:block;font-size:15.5px}
.act span span{font-size:13px;color:var(--mut)}
.f-sec{margin-bottom:18px}
.f-sec > label,.f-l{display:block;font-size:13.5px;font-weight:750;color:var(--mut);margin:0 2px 8px}
.pri{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tg{min-height:42px;padding:0 14px;border-radius:12px;background:var(--sf2);font-weight:700;color:var(--mut);display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.tg svg.i{width:17px;height:17px}
.tg.on.u{background:var(--hot);color:#fff}
.tg.on.m{background:var(--ac);color:var(--on-ac)}
.qlbl{font-size:13.5px;font-weight:700;padding:0 4px}
.proc-foot{display:flex;gap:10px;margin-top:auto;padding-top:12px}
.proc-foot .btn{flex:1}

/* Hoy */
.sum{display:flex;align-items:center;gap:12px;margin-top:2px}
.sum-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px}
.sum-t b{font-size:17px;font-weight:800}
.sum-t span{font-size:14px;color:var(--mut)}
.segbar{display:flex;gap:4px;margin-top:10px}
.segbar i{flex:1;height:6px;border-radius:3px;background:var(--sf3);transition:background .4s}
.segbar i.on{background:var(--ok)}
.okbar{margin-top:10px}.okbar i{background:var(--ok)!important}
.hero{position:relative;margin-top:16px;padding:16px;border-radius:22px;background:var(--sf);box-shadow:var(--glow);transition:opacity .3s,transform .3s var(--ease),box-shadow .2s}
.hero-l{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac-t)}
.hero-l b{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none;display:inline-block}
.is-run .live,.running .live{background:var(--ok);animation:pulse 1.4s infinite}
.hero-t{font-size:20px;font-weight:750;line-height:1.28;letter-spacing:-.01em;margin-top:8px;overflow-wrap:anywhere}
.hero .mt{margin-top:8px}
.hero-b{display:flex;gap:10px;margin-top:16px}
.hero.over{box-shadow:0 0 0 3px var(--ac),var(--glow);transform:scale(1.01)}
.hero.done{opacity:.35;transform:scale(.97)}
.warn6{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--warn-s);color:var(--warn);font-size:13.5px;font-weight:650}
.warn6 svg.i{width:17px;height:17px;margin-top:1px}
details.sec-d summary{list-style:none}
details.sec-d summary::-webkit-details-marker{display:none}
details.sec-d[open] .chev{transform:rotate(180deg)}

/* Agenda */
.ag-sin{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.ag-sin::-webkit-scrollbar{display:none}
.ag-chip{flex:none;max-width:210px;min-height:42px;padding:0 14px;border-radius:13px;background:var(--sf);border:1px solid var(--ln);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:650}
.ag-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-chip.sel{background:var(--ac);color:var(--on-ac);border-color:transparent}
.ag-banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--ac-s);color:var(--ac-t);font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.tl{position:relative;margin-top:14px;background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.tl-h{position:absolute;left:0;right:0;height:60px;border-top:1px solid var(--ln)}
.tl-h:first-child{border-top:0}
.tl-h span{position:absolute;left:12px;top:5px;font-size:12px;font-weight:650;color:var(--mut);font-variant-numeric:tabular-nums}
.tl-h::after{content:"";position:absolute;left:58px;right:0;top:30px;border-top:1px dashed var(--ln)}
.tl-b{position:absolute;border-radius:10px;padding:5px 8px;background:color-mix(in srgb,var(--a,#888) 17%,var(--sf));border-left:3px solid var(--a,#888);overflow:hidden;font-size:13.5px;line-height:1.25;transition:box-shadow .2s,transform .2s}
.tl-b b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b .tl-t{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.tl-b.hecha{opacity:.45}.tl-b.hecha b{text-decoration:line-through}
.tl-b.run{box-shadow:0 0 0 2px var(--ac)}
.tl-now{position:absolute;left:52px;right:0;height:0;border-top:2px solid var(--hot);z-index:5;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--hot)}
.tl.picking{box-shadow:0 0 0 2px var(--ac)}

/* Tablero */
.tb-top{display:flex;gap:8px;align-items:center}
.tb-top .seg{flex:1}
.filt{background:var(--sf2);border-radius:14px;width:46px;height:46px}
.filt.on{background:var(--ac-s);color:var(--ac-t)}
.coltabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:12px;background:var(--sf2);border-radius:14px;padding:4px}
.coltabs button{min-height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--mut);transition:all .2s var(--ease);text-align:center}
.coltabs b{font-size:12px;min-width:22px;padding:0 6px;border-radius:8px;background:var(--sf3);color:var(--ink);line-height:18px}
.coltabs b.full{background:var(--ac);color:var(--on-ac)}
.coltabs button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.board{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:0 16px;scrollbar-width:none;height:460px}
.board::-webkit-scrollbar{display:none}
body.dragging .board{scroll-snap-type:none}
.col{flex:0 0 min(84vw,330px);scroll-snap-align:start;scroll-margin-left:16px;display:flex;flex-direction:column;min-height:0;border-radius:20px;background:var(--sf2);transition:box-shadow .2s}
.col.over{box-shadow:0 0 0 2px var(--c)}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:800;font-size:15px}
.col-h .cd{width:9px;height:9px;border-radius:50%;background:var(--c)}
.col-h .cnt{font-size:13px;color:var(--mut);font-weight:700}
.col .list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 76px;display:flex;flex-direction:column;gap:8px;min-height:60px;-webkit-overflow-scrolling:touch}
.list > .empty:not(:only-child){display:none}
.col .empty{border:2px dashed var(--ln2);border-radius:14px;padding:18px 10px;font-size:13.5px}
.kc{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 10px 10px 16px;transition:opacity .3s,transform .3s var(--ease),box-shadow .2s;color:var(--ink)}
.kc::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--a,transparent)}
.kc-t{font-weight:650;font-size:15px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-right:4px}
.kc-f{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.kc-f .mt{flex:1;min-width:0;margin-top:0;padding-bottom:8px}
.qk{min-height:38px;padding:0 12px;border-radius:12px;background:var(--sf2);color:var(--ink);font-size:13.5px;font-weight:750;display:inline-flex;align-items:center;gap:5px;flex:none}
.qk svg.i{width:15px;height:15px;stroke-width:2.2}
.qk.pri{background:var(--ac);color:var(--on-ac)}
.qk.ok{background:var(--ok-s);color:var(--ok)}
.kc.hecha{opacity:.7}.kc.hecha .kc-t{text-decoration:line-through;color:var(--mut)}
.kc.run{box-shadow:var(--glow);border-color:transparent}
.kc.done{opacity:.4}.kc.out{opacity:0;transform:scale(.95)}
.qadd{padding:0 8px 8px}
.qadd input{width:100%;min-height:44px;border-radius:12px;border:1.5px dashed var(--ln2);background:transparent;padding:0 12px;outline:none}
.qadd input:focus{border-style:solid;border-color:var(--ac);background:var(--sf)}
.bloc{columns:2;column-gap:10px;margin-top:12px}
.note{break-inside:avoid;margin-bottom:10px;border-radius:16px;padding:12px;background:color-mix(in srgb,var(--a,#888) 12%,var(--sf));border:1px solid var(--ln);display:block;color:var(--ink)}
.note .nt{font-weight:650;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.note .nn{font-size:13px;color:var(--mut);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .nm{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;margin-top:10px;flex-wrap:wrap}
.note .qk{min-height:34px;font-size:12.5px;background:var(--sf)}

/* Enfoque */
.enf{--k:var(--ac-t)}
.enf.fase-corto,.enf.fase-largo,.enf.fase-listo{--k:var(--ok)}
.enf-task{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 16px}
.enf-l{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.enf-tt{font-size:16.5px;font-weight:750;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cyc{display:flex;gap:4px;margin-top:10px;max-width:160px}
.cyc i{flex:1;height:4px;border-radius:2px;background:var(--sf3)}
.cyc i.on{background:var(--ac)}
.cyc i.cur{background:linear-gradient(90deg,var(--ac) 50%,var(--sf3) 50%)}
.modes{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.ring-wrap{position:relative;width:min(64vw,250px);aspect-ratio:1;margin:18px auto 4px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fase{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--k)}
.tm{font-size:min(15vw,58px);font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.tm-sub{font-size:13.5px;color:var(--mut);min-height:19px}
.tm-xp{font-size:12.5px;font-weight:700;color:var(--k);display:flex;align-items:center;gap:4px;margin-top:4px;min-height:17px}
.tm-xp svg.i{width:14px;height:14px}
.durs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.durs .chip{min-height:36px;padding:0 12px;font-size:13.5px}
.ctl{display:flex;align-items:center;justify-content:center;gap:28px;margin:12px 0 4px}
.cbtn{width:54px;height:54px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mut);transition:transform .12s}
.cbtn:active{transform:scale(.92)}
.cbtn:disabled{opacity:.35}
.cbtn.big{width:78px;height:78px;border-radius:50%;background:var(--ac);color:var(--on-ac);border:0;box-shadow:var(--float)}
.enf.fase-corto .cbtn.big,.enf.fase-largo .cbtn.big{background:var(--ok);color:#fff}
.cbtn.big svg.i{width:30px;height:30px;stroke-width:2.8}
.tomrow{display:flex;align-items:center;justify-content:center;gap:3px;margin:10px 0 0;color:var(--mut);font-size:13.5px;font-weight:650;flex-wrap:wrap}
.tom{color:var(--mut2);display:grid}
.tom svg.i{width:18px;height:18px}
.tom.on{color:var(--hot)}
.tom.on svg.i{fill:color-mix(in srgb,var(--hot) 25%,transparent)}
.tom.new{animation:tpop .6s var(--ease)}
.tomrow span:last-child{margin-left:6px}
@keyframes tpop{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.qcap{display:flex;gap:8px;align-items:center;margin-top:16px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--sf);border:1px solid var(--ln)}
.qcap > svg.i{color:var(--mut2)}
.qcap input{flex:1;min-width:0;border:0;background:none;outline:none;min-height:42px}
.qcap .cap-send{width:42px;height:42px;border-radius:12px}
.caps{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.caps div{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;padding:2px 8px;animation:popin .3s var(--ease)}
.caps div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caps svg.i{width:14px;height:14px;color:var(--ok)}
.done-card{text-align:center;margin-top:10px}
.done-card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* Mini reproductor */
#mini{position:fixed;left:10px;right:10px;bottom:calc(72px + var(--bot));z-index:45;display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:var(--float);animation:popin .3s var(--ease)}
#mini.on{display:flex}
#mini .mt2{flex:1;min-width:0}
#mini .mt2 b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mt2 span{font-size:12.5px;opacity:.75}
#mini .tmm{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#mini .ib{color:var(--bg)}
#mini .ib svg.i.fill{stroke:none}

/* Progreso */
.lvl{display:flex;align-items:center;gap:14px}
.lvl-badge{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#6E6BFF,#A97BFF);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:800;flex:none}
.lvl .ln{font-size:16.5px;font-weight:800}
.bar{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#6E6BFF,#A97BFF);transition:width .6s var(--ease)}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{padding:12px}
.kpi .kv{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.kpi .kv small{font-size:13px;color:var(--mut);font-weight:700;margin-right:3px}
.kpi .kl{font-size:12.5px;color:var(--mut);font-weight:650;margin-top:4px;display:flex;align-items:center;gap:4px}
.kpi .kl svg.i{width:14px;height:14px;stroke-width:2.2}
.kpi .ks{font-size:11.5px;color:var(--mut2);margin-top:1px}
.ph-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ph-h h3{margin:0;font-size:15.5px;font-weight:800}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:12px}
.chart .cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .cv{font-size:11.5px;font-weight:700;color:var(--mut);min-height:15px}
.chart .cbar{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--ac);opacity:.4;min-height:4px;transition:height .6s var(--ease)}
.chart .cbar.zero{background:var(--sf3);opacity:1}
.chart .cbar.hoy{opacity:1}
.chart .cd{font-size:12.5px;font-weight:700;color:var(--mut)}
.chart .cd.hoy{color:var(--ink)}
.chart .ct{font-size:11.5px;color:var(--ok);font-weight:750;display:flex;align-items:center;gap:1px;min-height:15px}
.chart .ct svg.i{width:11px;height:11px;stroke-width:3}
.acc{margin-top:12px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
.acc > summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:58px;padding:0 12px 0 12px;font-weight:750;font-size:15.5px}
.acc > summary::-webkit-details-marker{display:none}
.acc > summary .ai{width:36px;height:36px;border-radius:11px;background:var(--sf2);display:grid;place-items:center;color:var(--mut)}
.acc > summary .ai svg.i{width:18px;height:18px}
.acc > summary .v{margin-left:auto;font-size:13.5px;color:var(--mut);font-weight:650}
.acc > summary .chev{color:var(--mut2)}
.acc[open] > summary .chev{transform:rotate(180deg)}
.acc-b{padding:0 14px 14px}
.abar{padding:9px 0}
.abar + .abar{border-top:1px solid var(--ln)}
.abar .nm{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px}
.abar .nm .v{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
.abar .tk2{height:6px;border-radius:3px;background:var(--sf2);margin-top:8px;overflow:hidden}
.abar .tk2 i{display:block;height:100%;border-radius:3px;background:var(--a)}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.in-b{text-align:center;padding:12px 4px;border-radius:14px;background:var(--sf2)}
.in-b .o{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--warn-s);color:var(--warn)}
.in-b.off .o{background:var(--sf3);color:var(--mut2)}
.in-b b{display:block;font-size:12.5px;line-height:1.2}
.in-b span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.25}
.in-b.off b{color:var(--mut)}
.h-day{font-size:13px;font-weight:750;color:var(--mut);margin:16px 2px 4px;text-transform:capitalize}
.hr{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);width:100%}
.hr:last-child{border-bottom:0}
.hr .dot{margin-top:7px}
.hr .ht{font-size:14.5px;font-weight:650}
.hr .hn{font-size:13px;color:var(--mut);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hr .hm{font-size:12.5px;color:var(--mut);white-space:nowrap;margin-left:auto;padding-left:8px;display:flex;align-items:center;gap:3px}
.hr .hm svg.i{width:13px;height:13px;color:var(--hot)}
.rec-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.rec-row:last-child{border-bottom:0}
.rec-row .ri{width:34px;height:34px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;color:var(--mut);flex:none}
.rec-row .ri svg.i{width:16px;height:16px}
.rec-row b{display:block;font-size:14.5px;font-weight:650}
.rec-row span span{font-size:13px;color:var(--mut)}

/* Hojas inferiores */
#sheetBg{position:fixed;inset:0;z-index:200;background:rgba(5,8,18,.45);opacity:0;pointer-events:none;transition:opacity .3s;cursor:pointer}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{--dy:0px;position:fixed;left:0;right:0;bottom:0;z-index:210;max-height:calc(100dvh - var(--top) - 40px);display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(calc(100% + 40px));transition:transform .34s var(--ease),visibility 0s linear .34s;box-shadow:0 -10px 40px rgba(0,0,0,.22);visibility:hidden}
#sheet.on{transform:translateY(var(--dy));visibility:visible;transition:transform .34s var(--ease),visibility 0s}
#sheetBody{overflow-y:auto;overscroll-behavior:contain;padding:0 16px;-webkit-overflow-scrolling:touch;flex:1}
.sh-top{position:sticky;top:0;z-index:3;margin:0 -16px 8px;padding:0 6px 4px 16px;background:var(--bg);touch-action:none}
.sh-top .grab{height:22px;display:grid;place-items:center;margin-right:10px;cursor:pointer}
.sh-top .grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--ln2)}
.sh-row{display:flex;align-items:center;gap:10px;min-height:46px}
.sh-row h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.sh-row .x{background:var(--sf2);border-radius:50%;width:40px;height:40px;color:var(--ink)}
.sh-foot{position:sticky;bottom:0;z-index:3;display:flex;gap:8px;margin:12px -16px 0;padding:10px 16px calc(10px + var(--bot));background:var(--bg);border-top:1px solid var(--ln)}
.sh-foot .btn{flex:1}
.sh-foot .btn.sq{flex:none}
.sh-end{height:calc(22px + var(--bot))}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:750;background:var(--sf2);color:var(--mut)}
.pill.ac{background:var(--ac-s);color:var(--ac-t)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.vio{background:var(--vio-s);color:var(--vio)}.pill.ok{background:var(--ok-s);color:var(--ok)}
.saved{font-size:12.5px;color:var(--ok);font-weight:700;opacity:0;transition:opacity .4s;display:inline-flex;gap:3px;align-items:center;flex:1}
.saved svg.i{width:14px;height:14px;stroke-width:2.6}
.saved.on{opacity:1}
.dt-title{width:100%;border:0;outline:0;background:none;resize:none;font-size:21px;font-weight:750;line-height:1.28;padding:0;margin:0 0 16px;letter-spacing:-.01em}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-bottom:8px}
.dt-meta{font-size:13px;color:var(--mut);margin:8px 2px 0}
.more{margin:6px 0 4px;border-top:1px solid var(--ln)}
.more > summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:52px;font-weight:700;color:var(--ac-t)}
.more > summary::-webkit-details-marker{display:none}
.more[open] > summary .chev{transform:rotate(180deg)}
.bit{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.bit-i{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;font-size:14px;overflow-wrap:anywhere}
.bit-i small{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
.bit-add{display:flex;gap:8px;align-items:flex-end}
.bit-add .cap-send{width:46px;height:46px}
.days{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.days button{width:40px;height:40px;border-radius:50%;background:var(--sf2);font-weight:700;font-size:13.5px;color:var(--mut)}
.days button.on{background:var(--ink);color:var(--bg)}
.tr.pl{border:0;text-align:left}
.tr.pl.on .ck{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.pl-cnt{font-weight:800;font-size:15px;color:var(--ac-t);padding:0 6px}
.set-r{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px}
.set-r + .set-r{border-top:1px solid var(--ln)}
.set-r .sl{flex:1;font-size:15px}
.set-r .sl small{display:block;font-size:12.5px;color:var(--mut)}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:38px;height:38px;border-radius:11px;background:var(--sf2);font-size:18px;font-weight:700}
.stp b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.sw{width:52px;height:32px;border-radius:16px;background:var(--sf3);position:relative;transition:background .2s;flex:none}

function siguienteFecha(rec, base) {
  const [k, v] = rec.split(':');
  if (k === 'diaria') return addDays(base, 1);
  if (k === 'laboral') { let d = addDays(base, 1); while ([0, 6].includes(parseYmd(d).getDay())) d = addDays(d, 1); return d; }
  if (k === 'semanal') {
    const set = (v || '').split(',').filter(Boolean).map(Number);
    if (!set.length) return addDays(base, 7);
    let d = addDays(base, 1);

const NIVELES = ['Novato','Aprendiz','Constante','Enfocado','Productivo','Imparable','Estratega','Maestro','Leyenda','Mítico'];

function xpSesion(s) {

  if (s.tipo === 'plan') return 10;

}

}

const AG_INI = 6, AG_FIN = 24;
function htmlAgenda(proceso, cola, hechas) {
  const items = [...proceso, ...cola];
  const sin = items.filter(t => !t.hora), con = [...items, ...hechas].filter(t => t.hora);
  const evs = con.map(t => ({ t, s:hm2min(t.hora), e:hm2min(t.hora) + Math.max(+t.dur || 30, 15) })).sort((a, b) => a.s - b.s);
  let grupo = null; const grupos = [];
  evs.forEach(ev => {
    if (!grupo || ev.s >= grupo.fin) { grupo = { evs:[], fin:0, carriles:[] }; grupos.push(grupo); }
    let c = grupo.carriles.findIndex(f => f <= ev.s);
    if (c < 0) { c = grupo.carriles.length; grupo.carriles.push(0); }
    grupo.carriles[c] = ev.e; ev.c = c; grupo.evs.push(ev); grupo.fin = Math.max(grupo.fin, ev.e);
  });
  grupos.forEach(g => g.evs.forEach(ev => ev.n = g.carriles.length));
  const alto = (AG_FIN - AG_INI) * 60;
  let horas = ''; for (let h = AG_INI; h < AG_FIN; h++) horas += `<div class="tl-h" style="top:${(h - AG_INI) * 60}px"><span>${h}:00</span></div>`;
  const bloques = evs.map(ev => {

      <div class="chart">${dias.map(d => { const m = minDia[d] || 0, td = st.tareasDia[d] || 0; return `<div class="cb"><span class="cv">${m ? m + 'm' : ''}</span><div class="cbar ${m ? '' : 'zero'} ${d === hoy() ? 'hoy' : ''}" style="height:${m ? Math.max(6, m / maxM * 100) : 4}%"></div><span class="ct">${td ? ic('check') + td : ''}</span><span class="cd ${d === hoy() ? 'hoy' : ''}">${DIAS1[parseYmd(d).getDay()]}</span></div>`; }).join('')}</div></div>

    const dist = Math.hypot(st.x - st.x0, st.y - st.y0);
    if (st.grip) { if (e.cancelable) e.preventDefault(); if (dist > 3) levantar(st); return; }
    if (!st.tactil && dist > 6) { clearTimeout(st.timer); levantar(st); }
    else if (st.tactil && dist > 9) { clearTimeout(st.timer); D.st = null; }
    return;
  }
  if (e.cancelable) e.preventDefault();
  mover(st);
}
function mover(st) {
  if (st.free) {
    const it = st.item, maxTop = (AG_FIN - AG_INI) * 60 - it.offsetHeight;
    const nt = clamp(Math.round((st.top0 + (st.y - st.yL) + (scrollY - st.sy0)) / 15) * 15, 0, maxTop);
    it.style.top = nt + 'px'; st.nt = nt;
    const t = byId(it.dataset.id), ini = AG_INI * 60 + nt;
    const lbl = $('.tl-t', it); if (lbl && t) lbl.textContent = `${min2hm(ini)} – ${min2hm(ini + Math.max(+t.dur || 30, 15))}`;
    return;
  }
  st.g.style.left = (st.x - st.dx) + 'px'; st.g.style.top = (st.y - st.dy) + 'px';
  colocar(st);
}
function colocar(st) {
  const el = document.elementFromPoint(st.x, st.y); if (!el) return;
  const list = el.closest('[data-list]');
  $$('.hero.over').forEach(h => h.classList.remove('over')); st.top = false;
  if (!list) return;
  if (list.dataset.list === 'hoytop') { if (!st.enBoard && st.origen === 'hoy') { st.top = true; list.classList.add('over'); } return; }
  if (!st.enBoard && list.dataset.list !== st.origen) return;
  $$('.col.over').forEach(c => c.classList.remove('over'));
  const col = list.closest('.col'); if (col) col.classList.add('over');
  const items = $$(':scope > [data-drag]', list).filter(n => n !== st.item);
  let antes = null;
  for (const n of items) { const r = n.getBoundingClientRect(); if (st.y < r.top + r.height / 2) { antes = n; break; } }
  const ref = antes || $(':scope > .empty', list);
  if (ref) { if (st.item.nextElementSibling !== ref || st.item.parentElement !== list) list.insertBefore(st.item, ref); }
  else if (st.item.parentElement !== list || st.item.nextElementSibling) list.appendChild(st.item);
}
function bucle(st) {
  if (D.st !== st || !st.lifted) return;
  let movio = false;
  const board = $('#board');
  if (board && st.enBoard && !st.free) {
    const r = board.getBoundingClientRect();
    if (st.x < r.left + 34 && board.scrollLeft > 0) { board.scrollLeft -= 9; movio = true; }
    else if (st.x > r.right - 34) { board.scrollLeft += 9; movio = true; }
  }
  const list = st.item.parentElement;
  if (!st.free && st.enBoard && list && list.scrollHeight > list.clientHeight + 2) {
    const r = list.getBoundingClientRect();
    if (st.y < r.top + 44) { list.scrollTop -= 8; movio = true; } else if (st.y > r.bottom - 44) { list.scrollTop += 8; movio = true; }
  } else {
    if (st.y < 110) { scrollBy(0, -9); movio = true; } else if (st.y > innerHeight - 150) { scrollBy(0, 9); movio = true; }
  }
  if (movio) mover(st);
  st.raf = requestAnimationFrame(() => bucle(st));
}
function dFin() {
  const st = D.st; if (!st) return;
  clearTimeout(st.timer);
  if (!st.lifted) { D.st = null; return; }
  cancelAnimationFrame(st.raf);
  D.justDragged = true; setTimeout(() => D.justDragged = false, 400);
  document.body.classList.remove('dragging');
  $$('.col.over,.hero.over').forEach(c => c.classList.remove('over'));
  if (st.free) {
    st.item.classList.remove('lift'); D.st = null;
    if (st.nt != null) { const t = byId(st.item.dataset.id); t.hora = min2hm(AG_INI * 60 + st.nt); upsertT(t); renderVista(); }
    return;
  }
  if (st.top) { st.g.remove(); st.item.classList.remove('ph'); D.st = null; hacerPrimera(st.item.dataset.id); return; }
  const r = st.item.getBoundingClientRect();
  st.g.style.transition = 'left .18s var(--ease),top .18s var(--ease),transform .18s';
  st.g.style.left = r.left + 'px'; st.g.style.top = r.top + 'px'; st.g.style.transform = 'none';
  setTimeout(() => {
    st.g.remove(); st.item.classList.remove('ph'); D.st = null;
    const list = st.item.parentElement;
    soltar(st.item.dataset.id, list.dataset.list, $$(':scope > [data-drag]', list).map(n => n.dataset.id), st.item, list);
  }, 190);
}
function soltar(id, destino, ids, el, list) {
  const t = byId(id); if (!t) return;
  if (destino !== t.estado) {
    if (destino === 'hecho') completar(t, el);
    else {
      const otra = destino === 'proceso' ? tareasEn('proceso').find(o => o.id !== id) : null;
      setEstado(t, destino);
      if (destino === 'proceso' && !T().corriendo) { T().tareaId = t.id; save(); }
      if (otra) toast(`«${otra.titulo}» regresó a Hoy. Una tarea a la vez.`);
    }
  }
  if (destino !== 'hecho') {
    const base = +(list && list.dataset.base) || 0;
    if (list && list.dataset.hero) { const h = byId(list.dataset.hero); if (h && +h.orden !== 0) { h.orden = 0; upsertT(h); } }
    ids.forEach((x, i) => { const o = byId(x); if (o && +o.orden !== base + i) { o.orden = base + i; upsertT(o); } });
  }
  renderVista();
}
document.addEventListener('touchstart', e => { if (e.touches.length === 1) dInicio(e, e.touches[0]); }, { passive:true });
document.addEventListener('mousedown', e => { if (e.button === 0) dInicio(e, e); });
document.addEventListener('touchmove', dMover, { passive:false });
document.addEventListener('mousemove', dMover);
document.addEventListener('touchend', dFin); document.addEventListener('touchcancel', dFin);
document.addEventListener('mouseup', dFin);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });

/* Deslizar hacia abajo para cerrar la hoja (desde el encabezado, o desde arriba del contenido) */
(() => {
  const sh = $('#sheet'), body = $('#sheetBody');
  let y0 = null, x0 = 0, dy = 0, activo = false, desdeCab = false;
  sh.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { y0 = null; return; }
    const t = e.target;
    desdeCab = !!t.closest('.sh-top');
    if (!desdeCab && (t.closest('input,textarea,select') || body.scrollTop > 0)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; activo = false;
  }, { passive:true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const d = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    if (!activo) {
      if (d > 8 && d > dx * 1.2 && (desdeCab || body.scrollTop <= 0)) { activo = true; sh.style.transition = 'none'; }
      else { if (d < -6 || dx > 12) y0 = null; return; }
    }
    dy = Math.max(0, d - 8);
    sh.style.setProperty('--dy', dy + 'px');
    if (e.cancelable) e.preventDefault();
  }, { passive:false });
  const fin = () => {
    if (y0 == null) return;
    sh.style.transition = '';
    if (activo && dy > 90) cerrarSheet(); else sh.style.setProperty('--dy', '0px');
    y0 = null; activo = false; dy = 0;
  };
  sh.addEventListener('touchend', fin); sh.addEventListener('touchcancel', fin);
  $('#sheetBg').addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive:false });
})();

/* ============ Inicio ============ */
function arrancar() {
  const pend = new Set(S.cola.map(o => o.fila.id));
  S.tareas = S.tareas.filter(t => !(t.borrado && !pend.has(t.id) && Date.now() - new Date(t.actualizado) > 30 * 864e5));
  rollover();
  if (S.insVistas === null) revisarLogros();
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + ui.view));
  estadoS = S.conn.url ? (S.cola.length ? 'pend' : 'ok') : 'sin';
  render();
  setInterval(tic, 500);
  setInterval(() => { if (document.visibilityState === 'visible' && !syncing) sincronizar(false); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tic(); sincronizar(false); if (T().corriendo) pantallaActiva(true); } else guardarYa(); });
  addEventListener('online', () => sincronizar(false));
  addEventListener('pagehide', guardarYa);
  addEventListener('resize', () => { if (ui.view === 'tablero') ajustarBoard(); });
  document.addEventListener('touchend', audioListo, { once:true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (ui.view === 'tablero') ajustarBoard(); });
  sincronizar(false);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
arrancar();
