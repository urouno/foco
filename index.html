<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foco">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Foco</title>
<style>
:root{
  --bg:#F3F2EE; --sf:#FFFFFF; --sf2:#EDECE7; --sf3:#F8F7F4; --ink:#17171C; --mut:#6E6D75; --mut2:#A5A4AB; --ln:#E3E1DA;
  --ac:#4F46E5; --ac-s:#ECECFE; --tom:#E5484D; --tom-s:#FCE9E9; --ok:#16A34A; --ok-s:#E5F5EA; --warn:#D97706; --warn-s:#FCF1DF; --vio:#7C3AED; --vio-s:#F0EAFE;
  --sh:0 1px 2px rgba(20,20,30,.05),0 3px 12px rgba(20,20,30,.05);
  --sh2:0 20px 44px rgba(20,20,30,.22),0 2px 6px rgba(20,20,30,.08);
  --top:max(env(safe-area-inset-top),12px); --bot:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E0E11; --sf:#18181D; --sf2:#222228; --sf3:#1C1C21; --ink:#F2F2F5; --mut:#9E9DA6; --mut2:#62616A; --ln:#2B2B32;
  --ac:#8E88FF; --ac-s:#25234B; --tom:#FF6369; --tom-s:#3B1D20; --ok:#3DD68C; --ok-s:#163222; --warn:#F5A524; --warn-s:#362913; --vio:#A78BFA; --vio-s:#2A2343;
  --sh:0 1px 2px rgba(0,0,0,.35); --sh2:0 20px 44px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--mut)}
.hide{display:none!important}

/* Encabezado */
#hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);padding:calc(var(--top) + 6px) 16px 10px;display:flex;align-items:flex-end;gap:10px}
#hdr .tt{flex:1;min-width:0}
#hTitle{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
#hSub{margin:2px 0 0;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);position:relative;flex:none}
.ib:active{background:var(--sf2)}
.ib.solid{background:var(--ink);color:var(--bg)}
.syncdot{position:absolute;top:8px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--mut2);border:2px solid var(--bg)}
.syncdot.ok{background:var(--ok)}.syncdot.pend{background:var(--warn)}.syncdot.err{background:var(--tom)}
.syncdot.run{background:var(--ac);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

main{padding:4px 16px calc(110px + var(--bot))}
.view{display:none;animation:vin .28s var(--ease)}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Barra inferior */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;padding:6px 6px calc(6px + var(--bot));background:color-mix(in srgb,var(--sf) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--ln)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;font-size:10.5px;font-weight:600;color:var(--mut2);position:relative;transition:color .2s}
#tabs button .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s var(--ease),transform .25s var(--ease)}
#tabs button.on{color:var(--ink)}
#tabs button.on .pill{background:var(--sf2);transform:scale(1.04)}
#tabs .bdg{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--tom);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}
#tabs button.enf .pill{background:var(--tom-s);color:var(--tom)}
#tabs button.enf.on .pill{background:var(--tom);color:#fff}

/* Tarjetas y piezas base */
.card{background:var(--sf);border-radius:18px;box-shadow:var(--sh);padding:14px}
.sec-t{display:flex;align-items:center;gap:8px;margin:22px 2px 8px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sec-t .n{font-weight:600;color:var(--mut2)}
.sec-t .sp{flex:1}
.hint{color:var(--mut);font-size:13px;margin:8px 2px 0}
.hint b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--sf2);color:var(--mut);font-size:13.5px;font-weight:600;white-space:nowrap;flex:none;transition:all .18s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--a,var(--mut2))}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.area.on{background:var(--a);color:#fff}
.chip.area.on .dot{background:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.tag svg.i{width:13px;height:13px;stroke-width:2}
.tag.a{color:var(--a)}
.tag.q1{color:var(--tom)}.tag.q2{color:var(--ac)}.tag.q3{color:var(--warn)}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut);transition:all .2s var(--ease)}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.btn{height:46px;padding:0 18px;border-radius:14px;background:var(--sf2);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.ac{background:var(--ac);color:#fff}
.btn.danger{color:var(--tom)}
.btn:active,.chip:active,.cta:active{transform:scale(.97)}
.in{width:100%;background:var(--sf2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;outline:none;transition:border .2s}
.in:focus{border-color:var(--ac)}
textarea.in{resize:none}
.empty{text-align:center;color:var(--mut);padding:26px 16px;font-size:14px}
.empty svg.i{width:34px;height:34px;color:var(--mut2);stroke-width:1.5;margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:8px}
.list > .empty:not(:only-child){display:none}

/* Tarjeta de tarea */
.tk{position:relative;display:flex;align-items:flex-start;gap:10px;background:var(--sf);border-radius:16px;box-shadow:var(--sh);padding:12px 12px 12px 14px;overflow:hidden;transition:transform .2s var(--ease),opacity .3s,max-height .35s}
.tk::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--a,transparent)}
.tk-b{flex:1;min-width:0}
.tk-t{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.tk-m{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px}
.tk-m:empty{display:none}
.tk .num{flex:none;width:22px;height:22px;border-radius:7px;background:var(--sf2);color:var(--mut);font-size:12.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.tk.first{box-shadow:0 0 0 2px var(--ink),var(--sh)}
.tk.first .num{background:var(--ink);color:var(--bg)}
.tk.run{box-shadow:0 0 0 2px var(--tom),var(--sh)}
.tk.run .num{background:var(--tom);color:#fff}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut2);display:grid;place-items:center;color:transparent;transition:all .25s var(--ease);margin-top:-1px}
.ck svg.i{width:15px;height:15px;stroke-width:3}
.tk.done .ck{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.12)}
.tk.done .tk-t{text-decoration:line-through;color:var(--mut)}
.tk.out{opacity:0;transform:translateX(30px)}
.play{flex:none;width:36px;height:36px;border-radius:50%;background:var(--tom-s);color:var(--tom);display:grid;place-items:center;margin:-4px -2px -4px 0}
.play svg.i{width:16px;height:16px;fill:currentColor;stroke-width:0}
.tk .x{flex:none;width:30px;height:30px;margin:-4px -4px -4px 0;border-radius:10px;display:grid;place-items:center;color:var(--mut2)}
.tk.mini{padding:10px 12px 10px 14px}
.tk.mini .tk-t{font-size:14.5px;font-weight:550}
.tk.hecha{opacity:.6}.tk.hecha .tk-t{text-decoration:line-through}
.badge-ahora{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--ink);border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.tk.run .badge-ahora{background:var(--tom);color:#fff}
.in-anim{animation:popin .35s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}

/* Arrastre */
[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ghost{position:fixed!important;z-index:1000;pointer-events:none;margin:0!important;transform:rotate(1.5deg) scale(1.04);box-shadow:var(--sh2)!important;opacity:.97;transition:none}
.ph{opacity:.25;box-shadow:none!important;outline:2px dashed var(--mut2);outline-offset:-2px}
body.dragging{cursor:grabbing}
body.dragging main,body.dragging .board{scroll-behavior:auto}
.lift{z-index:20;box-shadow:var(--sh2)!important;transform:scale(1.02)}

/* Bandeja */
.cap{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px;border-radius:22px}
.cap textarea{flex:1;border:0;outline:0;background:none;resize:none;padding:9px 0;max-height:160px;font-size:17px;line-height:1.35}
.cap textarea::placeholder{color:var(--mut2)}
.cap-btn{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;transition:transform .15s}
.cap-btn:active{transform:scale(.9)}
.cta{width:100%;margin-top:16px;height:56px;border-radius:18px;background:var(--ac);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 30%,transparent);transition:transform .15s}
.cta .c{background:rgba(255,255,255,.22);border-radius:10px;padding:1px 8px;font-size:14px}
.welcome{margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--ac-s);box-shadow:none}
.welcome p{margin:0;font-size:13.5px;flex:1}
.zero{text-align:center;padding:34px 10px 10px}
.zero .orb{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;background:var(--ok-s);color:var(--ok);display:grid;place-items:center}
.zero .orb svg.i{width:48px;height:48px;stroke-width:2.2}
.zero h3{margin:0;font-size:20px}
.zero p{margin:6px 0 0;color:var(--mut)}

/* Procesar */
#proc{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--top) + 4px) 16px calc(16px + var(--bot));overflow-y:auto}
#proc.on{display:flex;animation:vin .25s var(--ease)}
.proc-top{display:flex;align-items:center;gap:12px}
.proc-prog{flex:1;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.proc-prog div{height:100%;background:var(--ac);border-radius:3px;transition:width .4s var(--ease)}
.proc-n{font-size:13px;font-weight:700;color:var(--mut);min-width:36px;text-align:right}
.proc-card{margin:22px 0 18px;background:var(--sf);border-radius:24px;box-shadow:var(--sh);padding:20px;transition:transform .32s var(--ease),opacity .32s}
.proc-card.enter{animation:penter .38s var(--ease)}
@keyframes penter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.proc-card.fly-right{transform:translateX(120%) rotate(8deg);opacity:0}
.proc-card.fly-left{transform:translateX(-120%) rotate(-8deg);opacity:0}
.proc-card.fly-up{transform:translateY(-80%) scale(.9);opacity:0}
.proc-q{font-size:12.5px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:.06em}
.proc-tt{width:100%;border:0;outline:0;background:none;resize:none;font-size:23px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin-top:8px;padding:0}
.proc-meta{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--sf);border-radius:20px;box-shadow:var(--sh);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.act:active{transform:scale(.96)}
.act .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--k-s);color:var(--k)}
.act b{display:block;font-size:15.5px}
.act span{font-size:12.5px;color:var(--mut)}
.act.wide{grid-column:span 2;flex-direction:row;align-items:center;padding:12px 14px}
.act.wide .ico{width:34px;height:34px;border-radius:11px}
.f-sec{margin-bottom:18px}
.f-sec > label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:0 2px 8px;text-transform:uppercase;letter-spacing:.04em}
.pri{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tg{height:40px;padding:0 14px;border-radius:12px;background:var(--sf2);font-weight:650;color:var(--mut);display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.tg.on.u{background:var(--tom);color:#fff}
.tg.on.m{background:var(--ac);color:#fff}
.qlbl{font-size:13px;font-weight:700;padding:0 4px}
.proc-foot{display:flex;gap:10px;margin-top:auto;padding-top:12px}
.proc-foot .btn{flex:1}

/* Hoy */
.hoy-top{display:flex;align-items:center;gap:14px}
.ring-s{width:62px;height:62px;flex:none;position:relative}
.ring-s svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring-s .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.hoy-top .tx{flex:1;min-width:0}
.hoy-top b{display:block;font-size:16px}
.hoy-top span{font-size:13px;color:var(--mut)}
.plan-btn{height:40px;padding:0 14px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.plan-btn svg.i{width:17px;height:17px}
.warn6{margin:10px 2px 0;font-size:12.5px;color:var(--warn);display:flex;gap:6px;align-items:center}
details.done-sec summary{list-style:none;cursor:pointer}
details.done-sec summary::-webkit-details-marker{display:none}
details.done-sec[open] .chev{transform:rotate(180deg)}
.chev{transition:transform .2s}

/* Agenda */
.ag-sin{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px}
.ag-sin::-webkit-scrollbar{display:none}
.ag-chip{flex:none;max-width:200px;height:36px;padding:0 12px;border-radius:12px;background:var(--sf);box-shadow:var(--sh);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.ag-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--a,var(--mut2));flex:none}
.ag-chip.sel{background:var(--ink);color:var(--bg)}
.ag-banner{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--ac-s);color:var(--ac);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.tl{position:relative;margin-top:14px;background:var(--sf);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.tl-h{position:absolute;left:0;right:0;height:60px;border-top:1px solid var(--ln)}
.tl-h:first-child{border-top:0}
.tl-h span{position:absolute;left:10px;top:4px;font-size:11.5px;font-weight:600;color:var(--mut2);font-variant-numeric:tabular-nums}
.tl-h::after{content:"";position:absolute;left:56px;right:0;top:30px;border-top:1px dashed color-mix(in srgb,var(--ln) 70%,transparent)}
.tl-b{position:absolute;border-radius:10px;padding:5px 8px;background:color-mix(in srgb,var(--a,#888) 16%,var(--sf));border-left:3px solid var(--a,#888);overflow:hidden;font-size:13px;line-height:1.25;transition:box-shadow .2s,transform .2s}
.tl-b b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b .tl-t{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tl-b.hecha{opacity:.45}.tl-b.hecha b{text-decoration:line-through}
.tl-b.run{box-shadow:0 0 0 2px var(--tom)}
.tl-now{position:absolute;left:50px;right:0;height:0;border-top:2px solid var(--tom);z-index:5;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--tom)}
.tl.picking .tl-h{cursor:copy}
.tl.picking{box-shadow:0 0 0 2px var(--ac),var(--sh)}

/* Tablero */
.board{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:2px 16px 8px;scrollbar-width:none;height:calc(100dvh - 248px - var(--top) - var(--bot));min-height:380px}
.board::-webkit-scrollbar{display:none}
body.dragging .board{scroll-snap-type:none}
.col{flex:0 0 min(82vw,310px);scroll-snap-align:start;background:var(--sf2);border-radius:20px;display:flex;flex-direction:column;min-height:0;transition:box-shadow .2s,background .2s}
.col.over{box-shadow:0 0 0 2px var(--c)}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 14px;font-weight:750;font-size:14.5px}
.col-h .ci{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.col-h .ci svg.i{width:15px;height:15px;stroke-width:2.2}
.col-h .cnt{color:var(--mut);font-weight:600;font-size:13px}
.col-h .cnt.lim{color:var(--tom)}
.col-h .sp{flex:1}
.col .list{flex:1;overflow-y:auto;padding:2px 8px 12px;min-height:60px;-webkit-overflow-scrolling:touch}
.col .empty{padding:20px 8px;font-size:13px;border:2px dashed var(--ln);border-radius:14px;margin:2px 0}
.qadd{display:flex;gap:6px;padding:0 8px 8px}
.qadd input{flex:1;height:40px;border-radius:12px;border:0;background:var(--sf);padding:0 12px;outline:none;box-shadow:var(--sh)}
.filtros{margin-top:12px}

/* Bloc */
.bloc{columns:2;column-gap:10px;margin-top:12px}
.note{break-inside:avoid;margin-bottom:10px;border-radius:16px;padding:12px;background:color-mix(in srgb,var(--a,#999) 13%,var(--sf));box-shadow:var(--sh);display:block;width:100%;text-align:left}
.note .nt{font-weight:650;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.note .nm{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:6px}
.note .act-n{height:28px;padding:0 10px;border-radius:9px;background:var(--sf);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.note .act-n svg.i{width:13px;height:13px;stroke-width:2.2}

/* Enfoque */
.lvl-strip{display:flex;align-items:center;gap:12px;padding:10px 14px}
.lvl-strip .lv{width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
.lvl-strip .mid{flex:1;min-width:0}
.lvl-strip .mid b{font-size:13.5px}

'use strict';
/* ============ Utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const hoy = () => ymd();
const manana = () => addDays(hoy(), 1);
const diaDeISO = iso => iso ? ymd(new Date(iso)) : '';
const hm2min = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const min2hm = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  if (!s) return '';

async function sincronizar(manual) {
  if (!S.conn.url || !S.conn.clave) { estadoS = 'sin'; pintarSync(); if (manual) { toast('Conecta tu hoja en Ajustes'); abrirSheet({ k:'ajustes' }); } return false; }

    const j = await res.json();

}

  const mapa = new Map(S.tareas.map(t => [t.id, t]));

  const notas = { foco:[784, 988, 1175, 1568], descanso:[1175, 880, 660], nivel:[523, 659, 784, 1047, 1319] }[tipo] || [880];
  const t0 = actx.currentTime + .02;

function renderProgreso() {

  const minDia = {}, tarDia = {};
  S.sesiones.filter(esFoco).forEach(s => { const d = diaDeISO(s.fin); minDia[d] = (minDia[d] || 0) + (+s.min || 0); });
  dias.forEach(d => tarDia[d] = st.tareasDia[d] || 0);
  const maxM = Math.max(30, ...dias.map(d => minDia[d] || 0));
  const semMin = dias.reduce((s, d) => s + (minDia[d] || 0), 0);
  const ini = dias[0];
  const porArea = {};
  S.sesiones.filter(s => esFoco(s) && diaDeISO(s.fin) >= ini).forEach(s => { const k = s.area || 'sin'; porArea[k] = porArea[k] || { m:0, t:0 }; porArea[k].m += +s.min || 0; });

  const recs = vivas().filter(t => (t.rec || (t.fecha && t.fecha > hoy())) && t.estado !== 'hecho').sort((p, q) => (p.fecha || '9').localeCompare(q.fecha || '9'));

      <div class="card kpi"><div class="kv" style="color:var(--tom)">${ic('tomato')}${pomosHoy()}<small>/ ${S.ajustes.meta}</small></div><div class="kl">Pomodoros hoy</div></div>
      <div class="card kpi"><div class="kv" style="color:var(--ok)">${ic('check')}${hechasEl(hoy()).length}</div><div class="kl">Tareas hechas hoy</div></div>
      <div class="card kpi"><div class="kv">${Math.floor(semMin / 60)}<small>h</small>${semMin % 60}<small>m</small></div><div class="kl">Enfoque en 7 días</div></div>
    </div>
    <div class="card" style="margin-top:10px"><h3>Últimos 7 días</h3><div class="mut">Minutos de enfoque y tareas hechas</div>
      <div class="chart">${dias.map(d => { const m = minDia[d] || 0; return `<div class="cb"><span class="cv">${m ? m + 'm' : ''}</span><div class="cbar ${m ? '' : 'zero'}" style="height:${m ? Math.max(6, m / maxM * 100) : 4}%"></div><span class="ct">${tarDia[d] ? ic('check') + tarDia[d] : '&nbsp;'}</span><span class="cd ${d === hoy() ? 'hoy' : ''}">${DIAS1[parseYmd(d).getDay()]}</span></div>`; }).join('')}</div></div>

/* ============ Arrastrar con el dedo ============ */
const D = { st:null, justDragged:false };
function dInicio(e, p) {
  if (D.st) return;
  const item = e.target.closest('[data-drag]');
  if (!item || e.target.closest('button,input,textarea,select')) return;
  const tactil = e.type === 'touchstart';
  const st = D.st = { item, x0:p.clientX, y0:p.clientY, x:p.clientX, y:p.clientY, lifted:false, tactil };

function levantar(st) {
  if (D.st !== st || st.lifted) return;
  const it = st.item, r = it.getBoundingClientRect();
  st.lifted = true; st.free = it.hasAttribute('data-free');
  document.body.classList.add('dragging');
  if (navigator.vibrate) navigator.vibrate(12);
  if (st.free) { st.top0 = it.offsetTop; st.yL = st.y; st.sy0 = scrollY; it.classList.add('lift'); }
  else {
    const g = it.cloneNode(true); g.classList.add('ghost'); g.removeAttribute('data-drag');
    g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    document.body.appendChild(g); st.g = g; st.dx = st.x - r.left; st.dy = st.y - r.top;
    it.classList.add('ph');
  }
  st.raf = requestAnimationFrame(() => bucle(st));
}
function dMover(e) {
  const st = D.st; if (!st) return;
  const p = e.touches ? e.touches[0] : e;
  st.x = p.clientX; st.y = p.clientY;
  if (!st.lifted) {
    const dist = Math.hypot(st.x - st.x0, st.y - st.y0);
    if (!st.tactil && dist > 6) { clearTimeout(st.timer); levantar(st); }
    else if (st.tactil && dist > 9) { clearTimeout(st.timer); D.st = null; }
    return;
  }
  if (e.cancelable) e.preventDefault();
  mover(st);
}
function mover(st) {
  if (st.free) {
    const it = st.item, maxTop = (AG_FIN - AG_INI) * 60 - it.offsetHeight;
    const nt = clamp(Math.round((st.top0 + (st.y - st.yL) + (scrollY - st.sy0)) / 15) * 15, 0, maxTop);
    it.style.top = nt + 'px'; st.nt = nt;
    const t = byId(it.dataset.id), ini = AG_INI * 60 + nt;
    const lbl = $('.tl-t', it); if (lbl && t) lbl.textContent = `${min2hm(ini)} – ${min2hm(ini + Math.max(+t.dur || 30, 15))}`;
    return;
  }
  st.g.style.left = (st.x - st.dx) + 'px'; st.g.style.top = (st.y - st.dy) + 'px';
  colocar(st);
}
function colocar(st) {
  const el = document.elementFromPoint(st.x, st.y); if (!el) return;
  const list = el.closest('[data-list]'); if (!list) return;
  if (st.item.closest('[data-list]').dataset.list === 'hoy' && list.dataset.list !== 'hoy' && !$('#board')) return;
  $$('.col.over').forEach(c => c.classList.remove('over'));
  const col = list.closest('.col'); if (col) col.classList.add('over');
  const items = $$(':scope > [data-drag]', list).filter(n => n !== st.item);
  let antes = null;
  for (const n of items) { const r = n.getBoundingClientRect(); if (st.y < r.top + r.height / 2) { antes = n; break; } }
  const ref = antes || $(':scope > .empty', list);
  if (ref) { if (st.item.nextElementSibling !== ref || st.item.parentElement !== list) list.insertBefore(st.item, ref); }
  else if (st.item.parentElement !== list || st.item.nextElementSibling) list.appendChild(st.item);
}
function bucle(st) {
  if (D.st !== st || !st.lifted) return;
  let movio = false;
  const board = $('#board');
  if (board && !st.free) {
    const r = board.getBoundingClientRect();
    if (st.x < r.left + 34 && board.scrollLeft > 0) { board.scrollLeft -= 9; movio = true; }
    else if (st.x > r.right - 34) { board.scrollLeft += 9; movio = true; }
  }
  const list = st.item.parentElement;
  if (!st.free && list && list.scrollHeight > list.clientHeight + 2) {
    const r = list.getBoundingClientRect();
    if (st.y < r.top + 44) { list.scrollTop -= 8; movio = true; } else if (st.y > r.bottom - 44) { list.scrollTop += 8; movio = true; }
  } else {
    if (st.y < 110) { scrollBy(0, -9); movio = true; } else if (st.y > innerHeight - 150) { scrollBy(0, 9); movio = true; }
  }
  if (movio) mover(st);

}
function dFin() {
  const st = D.st; if (!st) return;
  clearTimeout(st.timer);

  cancelAnimationFrame(st.raf);
  D.justDragged = true; setTimeout(() => D.justDragged = false, 400);

  $$('.col.over').forEach(c => c.classList.remove('over'));
  if (st.free) {
    st.item.classList.remove('lift'); D.st = null;
    if (st.nt != null) { const t = byId(st.item.dataset.id); t.hora = min2hm(AG_INI * 60 + st.nt); upsertT(t); renderVista(); }
    return;
  }
  const r = st.item.getBoundingClientRect();
  st.g.style.transition = 'left .18s var(--ease),top .18s var(--ease),transform .18s';
  st.g.style.left = r.left + 'px'; st.g.style.top = r.top + 'px'; st.g.style.transform = 'none';
  setTimeout(() => {
    st.g.remove(); st.item.classList.remove('ph'); D.st = null;
    const list = st.item.parentElement;
    soltar(st.item.dataset.id, list.dataset.list, $$(':scope > [data-drag]', list).map(n => n.dataset.id), st.item);
  }, 190);
}
function soltar(id, destino, ids, el) {
  const t = byId(id); if (!t) return;
  if (destino !== t.estado) {
    if (destino === 'hecho') completar(t, el);
    else { setEstado(t, destino); if (destino === 'proceso' && !T().corriendo) { T().tareaId = t.id; save(); } }
  }
  if (destino !== 'hecho') ids.forEach((x, i) => { const o = byId(x); if (o && +o.orden !== i) { o.orden = i; upsertT(o); } });
  renderVista();
}
document.addEventListener('touchstart', e => { if (e.touches.length === 1) dInicio(e, e.touches[0]); }, { passive:true });
document.addEventListener('mousedown', e => { if (e.button === 0) dInicio(e, e); });
document.addEventListener('touchmove', dMover, { passive:false });
document.addEventListener('mousemove', dMover);
document.addEventListener('touchend', dFin); document.addEventListener('touchcancel', dFin);
document.addEventListener('mouseup', dFin);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });

/* Deslizar hacia abajo para cerrar la hoja */
(() => {
  const g = $('#grab'), sh = $('#sheet'); let y0 = null, dy = 0;
  g.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive:true });
  g.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive:true });
  g.addEventListener('touchend', () => { sh.style.transition = ''; if (dy > 90) cerrarSheet(); else sh.style.transform = ''; y0 = null; });
  g.addEventListener('click', () => cerrarSheet());
})();

function arrancar() {
  rollover();
  if (S.insVistas === null) revisarLogros();
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + ui.view));
  estadoS = S.conn.url ? (S.cola.length ? 'pend' : 'ok') : 'sin';
  render();
  setInterval(tic, 500);
  setInterval(() => { if (document.visibilityState === 'visible' && !syncing) sincronizar(false); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tic(); sincronizar(false); if (T().corriendo) pantallaActiva(true); } else guardarYa(); });
  addEventListener('online', () => sincronizar(false));
  addEventListener('pagehide', guardarYa);
  document.addEventListener('touchend', audioListo, { once:true });
  sincronizar(false);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
