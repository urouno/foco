<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foco">
<meta name="theme-color" content="#F0F0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<script>/* Aplica el tema elegido antes de pintar, sin parpadeo */try{var t=(JSON.parse(localStorage.getItem("foco.pref"))||{}).tema;if(t==="light"||t==="dark"){document.documentElement.dataset.theme=t;document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=t==="dark"?"#111113":"#F0F0F3"})}}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Foco</title>
<style>
/* ===== Sistema visual: menos, pero mejor. Fuente del sistema, 4 tamaños, retícula de 8, base neutra y un acento ===== */
:root{
  /* Base neutra, un solo acento (índigo). Sin blanco ni negro puros. */
  --bg:#F0F0F3; --sf:#FBFBFD; --sf2:#EDEDF0; --sf3:#E3E3E8;
  --ink:#1D1D1F; --mut:#626267; --mut2:#727277; --ln:rgba(60,60,67,.12); --ln2:#D2D2D7;
  --ac:#5856D6; --ac-s:#EEEEFB; --ac-t:#4B49C7; --on-ac:#FBFBFD;
  --ok:#1F7F37; --ok-f:#34C759; --ok-s:#E8F5EB;
  --hot:#C8102E; --hot-f:#FF3B30; --hot-s:#FCEDEC;
  --warn:#B04A00; --warn-f:#FF9500; --warn-s:#FFF3E5;
  --vio:var(--mut); --vio-s:var(--sf2);
  --glow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.14);
  --float:0 8px 24px -8px rgba(0,0,0,.22);
  /* Escala tipográfica: solo 4 tamaños */
  --fs-xl:32px; --fs-l:20px; --fs-m:16px; --fs-s:13px;
  /* Espaciado en múltiplos de 8 y radios */
  --r:16px; --top:max(env(safe-area-inset-top),8px); --bot:env(safe-area-inset-bottom);
  --tabs:64px; --mini:56px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --sf:#1C1C1E; --sf2:#2C2C2E; --sf3:#3A3A3C;
  --ink:#F5F5F7; --mut:#A1A1A6; --mut2:#8E8E93; --ln:rgba(255,255,255,.08); --ln2:rgba(255,255,255,.16);
  --ac:#5E5CE6; --ac-s:rgba(94,92,230,.22); --ac-t:#A5A3FF; --on-ac:#F5F5F7;
  --ok:#4BD97A; --ok-f:#30D158; --ok-s:rgba(48,209,88,.15);
  --hot:#FF7A72; --hot-f:#FF453A; --hot-s:rgba(255,69,58,.16);
  --warn:#FFB547; --warn-f:#FF9F0A; --warn-s:rgba(255,159,10,.16);
  --vio:var(--mut); --vio-s:var(--sf2);
  --glow:0 0 0 1px rgba(255,255,255,.06);
  --float:0 8px 24px -8px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111113; --sf:#1C1C1E; --sf2:#2C2C2E; --sf3:#3A3A3C;
  --ink:#F5F5F7; --mut:#A1A1A6; --mut2:#8E8E93; --ln:rgba(255,255,255,.08); --ln2:rgba(255,255,255,.16);
  --ac:#5E5CE6; --ac-s:rgba(94,92,230,.22); --ac-t:#A5A3FF; --on-ac:#F5F5F7;
  --ok:#4BD97A; --ok-f:#30D158; --ok-s:rgba(48,209,88,.15);
  --hot:#FF7A72; --hot-f:#FF453A; --hot-s:rgba(255,69,58,.16);
  --warn:#FFB547; --warn-f:#FF9F0A; --warn-s:rgba(255,159,10,.16);
  --vio:var(--mut); --vio-s:var(--sf2);
  --glow:0 0 0 1px rgba(255,255,255,.06);
  --float:0 8px 24px -8px rgba(0,0,0,.7);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html.lock,html.lock body{overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;font-size:var(--fs-m);line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button,a,input,textarea,select,label,summary,[data-a]{touch-action:manipulation}
[data-a]{cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:var(--fs-m)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;width:100%;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}
.mut{color:var(--mut)} .sm{font-size:var(--fs-s)} .hide{display:none!important} .sp{flex:1}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes penter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.shake{animation:shake .35s}

/* ===== Encabezado ===== */
#hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:2px;padding:calc(var(--top) + 8px) 8px 12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px)}
.hd-t{flex:1;min-width:0}
.hd-r{display:flex;align-items:center;gap:8px}
#hTitle{margin:0;font-size:var(--fs-xl);line-height:1.1;font-weight:700;letter-spacing:-.02em}
#hSub{margin:4px 0 0;font-size:var(--fs-s);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ac-t);margin-top:4px}
.info svg.i{width:21px;height:21px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut);position:relative;flex:none;transition:background .15s}
.ib:active{background:var(--sf2)}
.ib.st-ok{color:var(--ok)} .ib.st-pend{color:var(--warn)} .ib.st-err{color:var(--hot)} .ib.st-run{color:var(--ac-t)}
.ib.st-run svg.i{}
.streak{height:32px;margin-right:4px;padding:0 12px 0 8px;border-radius:999px;background:var(--sf2);color:var(--ink);font-weight:700;font-size:var(--fs-m);display:inline-flex;align-items:center;gap:4px;flex:none}
.streak svg.i{color:var(--warn-f);width:17px;height:17px;stroke-width:2.2}

main{padding:8px 16px calc(var(--tabs) + 112px + var(--bot))}
body.has-mini main{padding-bottom:calc(var(--tabs) + var(--mini) + 112px + var(--bot))}
.view{display:none}
.view.on{display:block;animation:vin .22s var(--ease)}

/* ===== Barra inferior ===== */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;padding:4px 4px calc(4px + var(--bot));background:color-mix(in srgb,var(--sf) 90%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--ln)}
#tabs button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-s);font-weight:600;color:var(--mut);position:relative;text-align:center}
#tabs .tp{width:58px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .25s var(--ease)}
#tabs .tp svg.i{width:23px;height:23px}
#tabs button.on{color:var(--ac-t)}
#tabs button.on .tp{background:var(--ac-s)}
#tabs .bdg{position:absolute;top:2px;left:calc(50% + 9px);min-width:19px;height:19px;padding:0 4px;border-radius:8px;background:var(--ac);color:var(--on-ac);font-size:var(--fs-s);line-height:19px;font-weight:700;font-style:normal}
#tabs .tdot{position:absolute;top:6px;left:calc(50% + 13px);width:9px;height:9px;border-radius:50%;background:var(--ok-f);border:2px solid var(--sf);}

/* ===== Botón de captura ===== */
#fab{position:fixed;right:16px;bottom:calc(var(--tabs) + 16px + var(--bot));z-index:44;height:48px;padding:0 20px 0 16px;border-radius:999px;background:var(--sf);color:var(--ac-t);border:1px solid var(--ln);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-m);box-shadow:var(--float);transition:transform .2s var(--ease),bottom .3s var(--ease)}
#fab:active{transform:scale(.95)}
#fab svg.i{width:22px;height:22px;stroke-width:2.3}
body.has-mini #fab{bottom:calc(var(--tabs) + var(--mini) + 16px + var(--bot))}

/* ===== Piezas base ===== */
.panel{background:var(--sf);border-radius:var(--r);padding:16px}
.group{background:var(--sf);border-radius:var(--r);overflow:hidden}
.sec-t{display:flex;align-items:center;gap:8px;margin:32px 4px 8px;font-size:var(--fs-s);font-weight:600;color:var(--mut)}
.sec-t svg.i{width:17px;height:17px}
.sec-t .n{font-weight:600;color:var(--mut);background:var(--sf3);border-radius:8px;padding:0 8px;font-size:var(--fs-s);line-height:20px}
.hint{color:var(--mut);font-size:var(--fs-s);margin:12px 4px 0;line-height:1.45}
.hint svg.i{width:15px;height:15px;vertical-align:-3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 16px;border-radius:999px;background:var(--sf2);color:var(--ink);font-size:var(--fs-m);font-weight:500;white-space:nowrap;flex:none;transition:background .18s,color .18s,transform .12s}
.chip svg.i{width:16px;height:16px}
.chip:active{transform:scale(.96)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--a,var(--mut2))}
.chip.on{background:var(--ac-s);color:var(--ac-t);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--ac)}
.chip.area.on{background:var(--ac-s);color:var(--ac-t)}
.chip:disabled{opacity:.4}
.dot{width:9px;height:9px;border-radius:50%;background:var(--a,var(--mut2));flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-s);font-weight:500;color:var(--mut);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag svg.i{width:14px;height:14px;stroke-width:2.1}
.pq{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:8px;font-size:var(--fs-s);font-weight:600;white-space:nowrap}
.pq svg.i{width:13px;height:13px;stroke-width:2.3}
.pq.q1{background:var(--ac-s);color:var(--ac-t)}.pq.q2,.pq.q3{background:var(--sf2);color:var(--mut)}
.seg{display:flex;background:var(--sf3);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:var(--fs-m);font-weight:600;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s var(--ease)}
.seg button svg.i{width:17px;height:17px}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{min-height:48px;padding:0 16px;border-radius:12px;background:var(--sf2);color:var(--ink);font-weight:600;font-size:var(--fs-m);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn svg.i{width:19px;height:19px}
.btn.pri{background:var(--ac);color:var(--on-ac)}
.btn.okb{background:var(--ok-s);color:var(--ok)}
.btn.ghost{background:var(--sf)}
.btn.danger{color:var(--hot)}
.btn.dangerf{background:var(--hot-f);color:#fff}
.btn.sm{min-height:40px;padding:0 16px;font-size:var(--fs-m);border-radius:12px}
.btn.sq{width:48px;padding:0;flex:none}
.btn.grow{flex:1}
.btn.full{width:100%}
.in{width:100%;min-height:48px;background:var(--sf2);border:1.5px solid transparent;border-radius:12px;padding:12px 12px;outline:none;transition:border .2s}
.in:focus{border-color:var(--ac);background:var(--sf)}
.in.bad{border-color:var(--hot-f)}
textarea.in{resize:none}
.err{color:var(--hot);font-size:var(--fs-s);font-weight:600;margin:8px 2px 0}
.okmsg{color:var(--ok);font-size:var(--fs-s);font-weight:600;margin:8px 2px 0}
.empty{text-align:center;color:var(--mut);padding:24px 12px;font-size:var(--fs-m)}
.zero{text-align:center;padding:24px 16px}
.zero .orb{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--ok-s);color:var(--ok);display:grid;place-items:center}
.zero .orb.ac{background:var(--ac-s);color:var(--ac-t)}
.zero .orb svg.i{width:34px;height:34px;stroke-width:2.1}
.zero h3{margin:0;font-size:var(--fs-l);font-weight:700}
.zero p{margin:8px auto 0;color:var(--mut);font-size:var(--fs-m);max-width:300px}
.in-anim{animation:popin .35s var(--ease)}
.row-link{width:100%;display:flex;align-items:center;gap:12px;margin-top:12px;min-height:56px;color:var(--ink)}
.row-link > span{flex:1}
.row-link b{font-weight:600}
.row-link > svg.i:first-child{color:var(--ac-t)}
.row-link > svg.i:last-child{color:var(--mut2)}
.tip{display:flex;align-items:flex-start;gap:12px;margin-top:16px;padding:12px 8px 12px 16px;border-radius:12px;background:var(--sf2);color:var(--mut);font-size:var(--fs-s);line-height:1.4}
.tip > svg.i{margin-top:1px;width:18px;height:18px}
.tip span{flex:1;color:var(--ink)}
.tip span svg.i{width:15px;height:15px;vertical-align:-3px;color:var(--mut)}
.tip .ib{width:32px;height:32px;margin:-4px 0;color:var(--mut)}
.tip .ib svg.i{width:16px;height:16px}

/* ===== Siguiente paso sugerido ===== */
.nx{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;margin-bottom:16px;border-radius:var(--r);background:var(--sf)}
.nx .ni{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ac-s);color:var(--ac-t);flex:none}
.nx .lnk{color:var(--ac-t);font-weight:600;font-size:var(--fs-m);display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;flex:none}
.nx .lnk svg.i{width:16px;height:16px}
.nx .nxt{flex:1;min-width:0}
.nx b{display:block;font-size:var(--fs-m);font-weight:600}
.nx small{display:block;font-size:var(--fs-s);color:var(--mut);margin-top:1px}

/* ===== Filas de tarea ===== */
.tr{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 8px 12px 16px;background:var(--sf);transition:opacity .3s,transform .3s var(--ease),background .15s;color:var(--ink)}
.tr + .tr::after{content:"";position:absolute;top:0;left:58px;right:0;border-top:1px solid var(--ln)}
.tr.nock + .tr::after,.tr.opt + .tr::after{left:16px}

.tr:active{background:var(--sf2)}
.tb{flex:1;min-width:0}
.tt{font-weight:600;font-size:var(--fs-m);line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:4px}
.mt:empty{display:none}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ln2);display:grid;place-items:center;font-size:var(--fs-s);font-weight:700;color:var(--mut);transition:all .25s var(--ease);position:relative;background:var(--sf)}
.ck svg.i{width:16px;height:16px;stroke-width:3;position:absolute;inset:0;margin:auto;opacity:0;transform:scale(.4);transition:all .25s var(--ease);color:#fff}
.ck:active{transform:scale(.88)}
.done .ck,.ck.on{background:var(--ok-f);border-color:var(--ok-f)}
.done .ck span,.ck.on span,.done .ck b,.ck.on b{opacity:0}
.done .ck svg.i,.ck.on svg.i{opacity:1;transform:none}
.tr.done .tt{text-decoration:line-through;color:var(--mut)}
.tr.out{opacity:0;transform:translateX(24px)}
.tr.hecha .tt{text-decoration:line-through;color:var(--mut);font-weight:500}
.grip{width:44px;height:50px;display:grid;place-items:center;color:var(--mut2);flex:none;touch-action:none;cursor:grab}
.grip svg.i{width:18px;height:18px}
.ib-s{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut2);flex:none}
.ib-s svg.i{width:19px;height:19px}

/* ===== Arrastre ===== */
[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed!important;z-index:1000;pointer-events:none;margin:0!important;transform:rotate(1.2deg) scale(1.03);box-shadow:var(--float)!important;border-radius:16px;opacity:.97;transition:none}
.ph{opacity:.3;outline:2px dashed var(--mut2);outline-offset:-3px}
.lift{z-index:20;box-shadow:var(--float)!important;transform:scale(1.02)}
body.dragging{cursor:grabbing}

/* ===== Bandeja ===== */
.cap{padding:8px 8px 8px;border-radius:24px;transition:box-shadow .2s}
.cap:focus-within{box-shadow:0 0 0 2px var(--ac)}
.cap-r{display:flex;align-items:flex-end;gap:8px}
.cap textarea{display:block;flex:1;min-width:0;border:0;outline:0;background:none;resize:none;padding:12px 12px 8px;font-size:var(--fs-m);line-height:1.4;min-height:70px;max-height:200px}
.cap textarea::placeholder{color:var(--mut2)}
.cap-send{width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--on-ac);display:grid;place-items:center;flex:none;transition:transform .12s,opacity .2s}
.cap-send:active{transform:scale(.9)}
.cap-send svg.i{stroke-width:2.4}
.cap-areas{display:flex;align-items:center;gap:8px;margin-top:4px;padding:8px 0 0 12px;border-top:1px solid var(--ln)}
.cap-areas > span{font-size:var(--fs-s);color:var(--mut);font-weight:500;flex:none}
.cap-areas .chips{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px;padding-right:8px}
.cap-areas .chips::-webkit-scrollbar{display:none}
.cap-areas .chip{min-height:34px;padding:0 12px;font-size:var(--fs-s)}
.tips{margin:8px 4px 0;font-size:var(--fs-s);color:var(--mut)}
.tips summary{list-style:none;display:inline-flex;align-items:center;gap:8px;font-weight:600;min-height:40px;color:var(--ac-t)}
.tips summary::-webkit-details-marker{display:none}
.tips summary svg.i{width:16px;height:16px}
.tips[open] .chev{transform:rotate(180deg)}
.tips div{padding:0 0 4px;line-height:1.55}
.tips b{color:var(--ink)}
.chev{transition:transform .2s}
.cta{width:100%;margin-top:24px;min-height:72px;padding:16px;border-radius:var(--r);background:var(--sf);color:var(--ink);display:flex;align-items:center;gap:12px;text-align:left;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta > span:not(.ico){flex:1}
.cta b{display:block;font-size:var(--fs-m);font-weight:600}
.cta small{font-size:var(--fs-s);color:var(--mut)}
.cta > svg.i{color:var(--ac-t)}
.cta .ico{width:40px;height:40px;border-radius:12px;background:var(--ac-s);color:var(--ac-t);display:grid;place-items:center;flex:none}
.conn{display:flex;align-items:center;gap:12px;margin-top:16px}
.conn .ci{width:40px;height:40px;border-radius:12px;background:var(--ac-s);color:var(--ac-t);display:grid;place-items:center;flex:none}
.conn b{font-size:var(--fs-m);font-weight:600}

/* ===== Captura estructurada ===== */
.capf{padding:16px 16px 12px;border-radius:24px;transition:box-shadow .2s}
.capf:focus-within{box-shadow:0 0 0 2px var(--ac)}
.capf-l{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);font-weight:600;color:var(--mut)}
.vsel{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 8px 0 12px;border-radius:999px;background:var(--sf2);font-size:var(--fs-s)}
.vsel b{font-weight:600;color:var(--ink)} .vsel b.nil{color:var(--ac-t)}
.vsel svg.i,.asel svg.i{width:16px;height:16px;color:var(--mut)}
.capf-in{display:block;width:100%;border:0;outline:0;background:none;resize:none;padding:12px 0;font-size:var(--fs-l);font-weight:500;line-height:1.3;min-height:56px;max-height:200px}
.capf-in::placeholder{color:var(--mut2)}
.capf-bot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--ln)}
.asel{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--sf2);font-size:var(--fs-m);color:var(--ink);max-width:60%}
.asel.full{width:100%;max-width:none;min-height:48px}
.capf-hint{margin:8px 4px 0;font-size:var(--fs-s);color:var(--mut);line-height:1.4}
.capf-hint:empty{display:none}
.capf-hint button{color:var(--ac-t);font-weight:600;text-align:left}
.clar{margin:0 0 16px;padding:12px 16px;border-radius:16px;background:var(--sf);display:flex;flex-direction:column;gap:12px}
.clar-i{display:flex;flex-direction:column;gap:8px}
.clar-t{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-s);color:var(--mut);line-height:1.4}
.clar-t svg.i{width:16px;height:16px;margin-top:1px;color:var(--ac-t)}
.clar-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.clar-a .chip{min-height:32px;padding:0 12px;font-size:var(--fs-s)}
.lnk2{color:var(--ac-t);font-weight:600;font-size:var(--fs-s);min-height:32px;display:inline-flex;align-items:center;gap:4px}
.lnk2 svg.i{width:14px;height:14px}
.row-add{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;margin-top:12px;padding:0 16px;border-radius:12px;background:var(--ac-s);color:var(--ac-t);font-weight:600}
.xmini{width:24px;height:24px;margin-right:-8px;display:grid;place-items:center;color:var(--mut)}
.xmini svg.i{width:14px;height:14px}
.res-l{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:var(--fs-s);color:var(--mut);line-height:1.4}
.res-l svg.i{width:14px;height:14px;margin-top:2px;flex:none}
.mut2{color:var(--mut2)}
#sheet.top{z-index:320} #sheetBg.top{z-index:315}
html.calma .view.on,html.calma .in-anim,html.calma .tom.new,html.calma .proc-card.enter,html.calma .onb-art .big,html.calma .dlg-box,html.calma #lvlUp .box{animation:none}

/* ===== Organizar ===== */
#proc{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--top) + 4px) 16px calc(16px + var(--bot));overflow-y:auto;overscroll-behavior:contain}
#proc.on{display:flex;animation:vin .25s var(--ease)}
.proc-top{display:flex;align-items:center;gap:12px}
.proc-prog{flex:1;height:6px;border-radius:3px;background:var(--sf3);overflow:hidden}
.proc-prog div{height:100%;background:var(--ac);border-radius:3px;transition:width .4s var(--ease)}
.proc-n{font-size:var(--fs-s);font-weight:600;color:var(--mut);min-width:40px;text-align:right}
.proc-card{margin:16px 0 16px;background:var(--sf);border-radius:24px;padding:16px;transition:transform .32s var(--ease),opacity .32s}
.proc-card.enter{animation:penter .38s var(--ease)}
.proc-card.fly-right{transform:translateX(120%) rotate(8deg);opacity:0}
.proc-card.fly-left{transform:translateX(-120%) rotate(-8deg);opacity:0}
.proc-card.fly-up{transform:translateY(-80%) scale(.9);opacity:0}
.proc-q{font-size:var(--fs-s);font-weight:700;color:var(--ac-t);letter-spacing:.04em;text-transform:uppercase}
.proc-tt{width:100%;border:0;outline:0;background:none;resize:none;font-size:var(--fs-l);font-weight:700;line-height:1.28;letter-spacing:-.01em;margin-top:8px;padding:0}
.proc-meta{font-size:var(--fs-s);color:var(--mut);margin-top:8px}
.proc-h{font-size:var(--fs-m);color:var(--mut);margin:0 4px 12px}
.two{width:100%;display:flex;align-items:center;gap:16px;padding:16px 16px;border-radius:var(--r);background:var(--sf);text-align:left;min-height:74px;transition:transform .12s}
.two:active{transform:scale(.98)}
.two .ico{width:40px;height:40px;border-radius:12px;background:var(--sf2);color:var(--ink);display:grid;place-items:center;flex:none}
.two > span:nth-child(2){flex:1}
.two b{display:block;font-size:var(--fs-m);font-weight:600}
.two small{font-size:var(--fs-s);color:var(--mut)}
.two > svg.i{color:var(--mut2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{background:var(--sf);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:116px;transition:transform .12s}
.act:active{transform:scale(.96)}
.act .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sf2);color:var(--ink)}
.act.del .ico{color:var(--hot)}
.act b{display:block;font-size:var(--fs-m);font-weight:600}
.act span span{font-size:var(--fs-s);color:var(--mut)}
.f-sec{margin-bottom:16px}
.f-sec > label,.f-l{display:block;font-size:var(--fs-s);font-weight:600;color:var(--mut);margin:0 2px 8px}
.proc-foot{display:flex;gap:12px;margin-top:auto;padding-top:12px}
.proc-foot .btn{flex:1}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx-c{min-height:68px;padding:12px 12px;border-radius:12px;background:var(--sf2);text-align:left;border:2px solid transparent;transition:all .18s}
.mx-c b{display:block;font-size:var(--fs-m);font-weight:600}
.mx-c span{display:block;font-size:var(--fs-s);color:var(--mut);margin-top:2px;line-height:1.3}
.mx-c.q1 b{color:var(--ac-t)}
.mx-c.on{border-color:currentColor}
.mx-c.on{color:var(--ac);background:var(--ac-s)}.mx-c.on b{color:var(--ac-t)}.mx-c.on.q1{color:var(--ac);background:var(--ac-s)}.mx-c.on.q1 b{color:var(--ac-t)}

/* ===== Hoy ===== */
.sum{display:flex;align-items:center;gap:12px}
.sum-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.sum-t b{font-size:var(--fs-l);font-weight:700}
.sum-t span{font-size:var(--fs-m);color:var(--mut)}
.segbar{display:flex;gap:4px;margin-top:12px}
.segbar i{flex:1;height:6px;border-radius:3px;background:var(--sf3);transition:background .4s}
.segbar i.on{background:var(--ok-f)}
.okbar{margin-top:12px}.okbar i{background:var(--ok-f)!important}
.hero{position:relative;margin-top:24px;padding:24px 20px 20px;border-radius:24px;background:var(--sf);box-shadow:var(--glow);transition:opacity .3s,transform .3s var(--ease),box-shadow .2s}
.hero-l{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ac-t)}
.hero-l b{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none;display:inline-block}
.is-run .live,.running .live{background:var(--ok-f);}
.hero-t{font-size:var(--fs-l);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin-top:8px;overflow-wrap:anywhere}
.hero .mt{margin-top:8px}
.hero-b{display:flex;gap:12px;margin-top:16px}
/* Enfoque dentro de la tarjeta: barra de avance y modo elegido */
.hero-bar{height:6px;border-radius:3px;background:var(--sf3);margin-top:16px;overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .5s linear}
.hero-bar.desc i{background:var(--ok-f)}
.hero-m{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:var(--fs-s);color:var(--mut)}
.hero-m svg.i{width:15px;height:15px}
.hero-m .lnk2{margin-left:auto}
.hero.over{box-shadow:0 0 0 3px var(--ac),var(--glow);transform:scale(1.01)}
.hero.done{opacity:.35;transform:scale(.97)}
.warn6{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:12px 12px;border-radius:12px;background:var(--warn-s);color:var(--warn);font-size:var(--fs-s);font-weight:600}
.warn6 svg.i{width:17px;height:17px;margin-top:1px}
details.sec-d summary{list-style:none}
details.sec-d summary::-webkit-details-marker{display:none}
details.sec-d[open] .chev{transform:rotate(180deg)}

/* ===== Agenda ===== */
.ag-sin{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.ag-sin::-webkit-scrollbar{display:none}
.ag-chip{flex:none;max-width:220px;min-height:42px;padding:0 16px;border-radius:999px;background:var(--sf);display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-m);font-weight:500}
.ag-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-chip.sel{background:var(--ac-s);color:var(--ac-t);box-shadow:inset 0 0 0 1.5px var(--ac)}
.ag-banner{margin-top:12px;padding:12px 12px;border-radius:12px;background:var(--ac-s);color:var(--ac-t);font-size:var(--fs-s);font-weight:600;display:flex;align-items:center;gap:8px}
.tl-wrap{margin-top:12px;background:var(--sf);border-radius:var(--r);overflow-y:auto;overscroll-behavior:contain;height:420px;-webkit-overflow-scrolling:touch;transition:box-shadow .2s}
.tl{position:relative}
.tl-h{position:absolute;left:0;right:0;height:60px;border-top:1px solid var(--ln)}
.tl-h:first-child{border-top:0}
.tl-h span{position:absolute;left:12px;top:5px;font-size:var(--fs-s);font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.tl-h::after{content:"";position:absolute;left:58px;right:0;top:30px;border-top:1px dashed var(--ln)}
.tl-b{position:absolute;border-radius:8px;padding:4px 8px;background:color-mix(in srgb,var(--a,#888) 18%,var(--sf));border-left:3px solid var(--a,#888);overflow:hidden;font-size:var(--fs-s);line-height:1.25;transition:box-shadow .2s,transform .2s}
.tl-b b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b .tl-t{font-size:var(--fs-s);color:var(--mut);font-variant-numeric:tabular-nums}
.tl-b.hecha{opacity:.45}.tl-b.hecha b{text-decoration:line-through}
.tl-b.run{box-shadow:0 0 0 2px var(--ac)}
.tl-now{position:absolute;left:52px;right:0;height:0;border-top:2px solid var(--ac);z-index:5;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.tl-wrap.picking{box-shadow:0 0 0 2px var(--ac)}
.tl-b b svg.i{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.tl-b.f-ahora{box-shadow:0 0 0 2px var(--ok-f)}
.tl-b.f-tarde{border-left-color:var(--warn-f)}.tl-b.f-tarde .tl-t{color:var(--warn)}
.tag.f-ahora{color:var(--ok);font-weight:700}.tag.f-pronto{color:var(--ac-t);font-weight:600}.tag.f-tarde{color:var(--warn);font-weight:600}
/* Semana */
.wk{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;scroll-behavior:smooth}
.wk::-webkit-scrollbar{display:none}
.wk-d{flex:none;width:56px;padding:8px 0 10px;border-radius:14px;background:var(--sf);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.wk-d span{font-size:var(--fs-s);color:var(--mut);font-weight:600;text-transform:capitalize}
.wk-d b{font-size:var(--fs-l);font-weight:700;font-variant-numeric:tabular-nums}
.wk-d.hoy span{color:var(--ac-t)}
.wk-d.on{background:var(--ac);color:var(--on-ac)}.wk-d.on span{color:var(--on-ac);opacity:.85}
.wk-n{position:absolute;top:4px;right:6px;font-style:normal;font-size:11px;font-weight:700;color:var(--ac-t)}.wk-d.on .wk-n{color:var(--on-ac)}
.wk-l{display:block;width:32px;height:4px;border-radius:2px;background:var(--sf3);overflow:hidden;margin-top:4px}
.wk-l i{display:block;height:100%;background:var(--ac)}.wk-d.on .wk-l{background:rgba(255,255,255,.3)}.wk-d.on .wk-l i{background:var(--on-ac)}
/* Línea del día */
.ld{display:block;width:100%;margin-top:16px;padding:12px;border-radius:var(--r);background:var(--sf);text-align:left}
.ld-r{position:relative;height:20px;border-radius:6px;background:var(--sf3)}
.ld-r i{position:absolute;top:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--a,#888) 55%,var(--sf3));min-width:4px}
.ld-r i.ok{background:var(--ok-f)}.ld-r i.ahora{box-shadow:0 0 0 2px var(--ok-f)}.ld-r i.tarde{background:var(--warn-f);opacity:.7}
.ld-r u{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ac);border-radius:1px}
.ld-h{display:flex;justify-content:space-between;margin-top:8px;font-size:var(--fs-s);color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
.nx.toca{margin:16px 0 0;box-shadow:inset 0 0 0 1.5px var(--ok-f)}.nx.toca .ni{background:var(--ok-s);color:var(--ok)}
/* Subpestañas y filtro por verbo */
.subnav{margin-bottom:16px}
.chips.vf{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.chips.vf::-webkit-scrollbar{display:none}
.chip .n{font-size:var(--fs-s);color:var(--mut);font-weight:600}.chip.on .n{color:var(--ac-t)}

/* ===== Fase 3: Progreso con un indicador principal ===== */
.pmain{margin-top:12px}
.pm-n{display:flex;align-items:baseline;gap:8px}
.pm-n b{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.pm-n span{color:var(--mut);font-size:var(--fs-m)}
.pmain .chart{height:110px;margin-top:16px}
.pmain.vacio p{margin:12px 0 12px;color:var(--mut)}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pm-n .lnk2{margin-left:auto}
.ptile{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 12px;border-radius:var(--r);background:var(--sf);color:var(--ink);text-align:left}
.ptile .tb b{display:block;font-size:var(--fs-m);font-weight:700}
.ptile .tb small{display:block;font-size:var(--fs-s);color:var(--mut);line-height:1.25}
.ptile > svg.chev{width:16px;height:16px;color:var(--mut2);flex:none;transition:transform .2s}
.ptile > svg.chev.up{transform:rotate(180deg)}
.ptile.on{box-shadow:inset 0 0 0 2px var(--ac)}
#v-progreso .acc{margin-top:12px}
#v-progreso .acc summary .v{white-space:nowrap}
/* ===== Fase 2: Planifica y Bandeja sin saturar ===== */
.fbar .agr{flex:none;margin-right:auto}
.fbar .agr button{padding:0 12px}
.ls-add{margin-top:10px}
.ag-top{display:flex;align-items:center;gap:8px;margin-top:12px}
.ag-dia{flex:1;min-width:0}
.ag-dia > div{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.ag-dia b{font-size:var(--fs-l);font-weight:700}
.ag-dia span{font-size:var(--fs-s);color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.ag-dia .cap-b{display:block;margin-top:6px;height:4px}
.ag-top .ib.filt{width:44px;height:44px;flex:none}
.ag-pend{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-top:12px;padding:0 12px;border-radius:12px;background:var(--sf);color:var(--ink);font-size:var(--fs-s);text-align:left}
.ag-pend > svg.i{width:16px;height:16px;color:var(--ac-t);flex:none}
.ag-pend span{flex:1}.ag-pend b{color:var(--ac-t)}
.ag-banner{display:flex;align-items:center;gap:8px}.ag-banner span{flex:1}
.sm-ir{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--sf2);color:var(--ink);cursor:pointer}
.sm-ir svg.i{width:18px;height:18px}
.sm-ir input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sm-h small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.capf .capf-in{padding-top:4px}
.capf-bot{flex-wrap:wrap}
.capf-bot .btn svg.i{width:16px;height:16px}
.capf-bot .vsel,.capf-bot .asel{min-height:36px;font-size:var(--fs-s);border-radius:10px;padding:0 10px;max-width:40%}
@media (max-width:400px){.capf-bot .lg{display:none}}
.tr .chev-r{width:16px;height:16px;color:var(--mut2);flex:none}
/* ===== Cabecera mínima y captura en la navegación ===== */
#infoBtn,#streakBtn,#searchBtn,#gearBtn{display:none!important}
#fab{display:none!important}
.mi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--sf2);color:var(--ac-t);flex:none}
.mi svg.i{width:18px;height:18px}
kbd.mk{font:600 12px/1 inherit;color:var(--mut);padding:4px 7px;border-radius:6px;background:var(--sf2);border:1px solid var(--ln)}
#tabs .tcap{order:3}
#tabs .tcap .tp{width:48px;height:48px;border-radius:50%;background:var(--ac);color:var(--on-ac);box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 35%,transparent)}
#tabs .tcap .tp svg.i{width:24px;height:24px;stroke-width:2.4}
#tabs .tcap .tl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#tabs > button:nth-of-type(1),#tabs > button:nth-of-type(2){order:1}
#tabs > button:nth-of-type(3),#tabs > button:nth-of-type(4){order:4}
#tabs .brand{order:0}#tabs .side-f{order:9}
/* Enfoque inmersivo: solo el tiempo, un control y la salida */
body.inmersivo{--tabs:0px}
body.inmersivo #tabs,body.inmersivo #menuBtn,body.inmersivo #hSub,body.inmersivo #mini{display:none!important}
/* ===== Hoy: Ahora, avance en una línea, lo demás plegado ===== */
.hoy-a .hero{margin-top:4px}
.hoy-a .panel.zero{margin-top:4px}
.hero-m #heroFin{flex:1;min-width:0}
.arr{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:8px;border-radius:12px;color:var(--ac-t);font-weight:600;font-size:var(--fs-s)}
.arr svg.i{width:16px;height:16px}
.avance{margin-top:20px}
.av-t{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.av-t b{font-size:var(--fs-l);font-weight:700}
.av-t span{color:var(--mut)}
.av-t small{margin-left:auto;font-size:var(--fs-s);color:var(--mut)}
.avance .segbar{margin-top:8px}
.prox{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-top:12px;padding:8px 12px;border-radius:12px;background:var(--sf);color:var(--ink);text-align:left;font-size:var(--fs-s)}
.prox > svg.i{width:16px;height:16px;color:var(--ac-t);flex:none}
.prox span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prox small{color:var(--mut);flex:none}
.hoy-acc{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
.hoy-acc .lnk2{min-height:40px}
.mas{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:44px;margin-top:6px;border-radius:12px;color:var(--ac-t);font-weight:600;font-size:var(--fs-s)}
.mas svg.i{width:16px;height:16px}.mas svg.i.up{transform:rotate(180deg)}
.sub-t{margin:12px 4px 6px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
/* ===== Hoy: prioridades, decisiones pendientes ===== */
.ordn{flex:none;width:22px;margin-right:-6px;text-align:center;font-size:var(--fs-s);font-weight:700;color:var(--ac-t);font-variant-numeric:tabular-nums}
.sum-e{margin:6px 2px 0;font-size:var(--fs-s);color:var(--mut)}
.tr.dec{align-items:flex-start}
.dec-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dec-b .qk{min-height:36px}
.tr.pl.sust .ck{border-color:var(--warn-f);box-shadow:0 0 0 2px var(--warn-s)}
.tr.pl.pend{box-shadow:inset 0 0 0 2px var(--ac)}
.tr.pl:disabled{opacity:.55}
.dt-rep{display:flex;align-items:center;gap:6px;margin:10px 4px 0}
.dt-rep svg.i{width:14px;height:14px}
.warn6 .lnk{margin-left:auto;flex:none;color:var(--ac-t);font-weight:600}

/* ===== Agenda: capacidad, solapamientos y navegación ===== */
.ag-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.ag-nav .in{flex:1;min-width:150px;min-height:40px}
.sm-acc .in{width:100%;min-height:40px}
.cap-l{margin-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:var(--fs-s);color:var(--mut)}
.cap-b{flex:1 0 100%;height:6px;border-radius:3px;background:var(--sf3);overflow:hidden;margin-top:4px}
.cap-b i{display:block;height:100%;background:var(--ac);border-radius:3px}
.cap-b.over i,.wk-l.over i{background:var(--warn-f)}
.wk-d.pas{opacity:.65}
.sol{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sol-i{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--warn-s);color:var(--ink);font-size:var(--fs-s)}
.sol-i > svg.i{color:var(--warn);width:18px;height:18px;flex:none;margin-top:1px}
.sol-i b{display:block;color:var(--warn);font-size:var(--fs-s)}
.sol-i span{display:block;margin-top:2px}
.tl-b.solapa{box-shadow:inset 0 0 0 2px var(--warn-f)}
/* Bloques cortos (≤ 30 min): título y hora en un renglón para que nada quede cortado */
.tl-b.corta{display:flex;align-items:center;gap:8px;padding-top:2px;padding-bottom:2px}
.tl-b.corta b{flex:0 1 auto;min-width:0}
.tl-b.corta .tl-t{flex:none;white-space:nowrap}
.sm-in{width:auto;min-width:110px;min-height:40px}
/* Densidad compacta: menos aire, mismo tamaño de texto y de controles */
.compacta .tr{min-height:52px;padding-top:8px;padding-bottom:8px}
.compacta .mt{margin-top:2px}
.compacta .sec-t{margin-top:20px}
.compacta .kc{padding:8px 10px 8px 12px}
.compacta .col .list{gap:6px}
.compacta .kc-f{margin-top:4px}

/* ===== Bandeja: selección múltiple ===== */
.lote-bar{position:sticky;top:calc(var(--top) + 64px);z-index:5;display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px;border-radius:12px;background:var(--sf);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.lote-bar b{flex:1;font-size:var(--fs-s)}
/* ===== Progreso ===== */
.per-r{display:flex;align-items:center;gap:6px;margin:10px 2px 0}
.per-r svg.i{width:14px;height:14px}
.kpi{text-align:left;color:var(--ink);width:100%}
.kpi.on{box-shadow:inset 0 0 0 2px var(--ac)}
.kdet{margin-top:12px}
.seg.mini{padding:3px}.seg.mini button{min-height:30px;font-size:var(--fs-s);padding:0 10px}
.chart.mes .cb .cbar{border-radius:3px 3px 1px 1px}
.chart.mes{gap:2px}

/* ===== Filtros compartidos y búsqueda ===== */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.fbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--sf3);color:var(--ink);font-weight:600;font-size:var(--fs-s)}
.fbtn svg.i{width:16px;height:16px}
.fbtn.on{background:var(--ac-s);color:var(--ac-t)}
.fbtn b{min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:var(--on-ac);font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
.fbar .chip{min-height:40px}
.fbar .chip svg.i{width:14px;height:14px;margin-left:2px}
.fcnt{font-size:var(--fs-s);color:var(--mut);font-weight:600;margin-left:auto}
.sm-side .fbar{margin:0 0 12px}
.sum-b{display:flex;gap:8px;flex:none;margin-left:auto}
.sum{flex-wrap:wrap;row-gap:8px}
.sum-t{white-space:nowrap;flex:1 0 auto}
#hdr #backBtn{margin-left:-8px}
.bres{align-items:center;text-align:left}
.bres .tb{display:block}
.bres .tt{display:block}
.est{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:8px;background:var(--sf2);color:var(--mut);font-size:var(--fs-s);font-weight:600}
.est.hoy,.est.proceso{background:var(--ac-s);color:var(--ac-t)}
.est.hecho{background:var(--ok-s);color:var(--ok)}
.bnota{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:var(--fs-s);color:var(--mut);line-height:1.35}
.bnota svg.i{width:14px;height:14px;flex:none;margin-top:1px}
#buscarIn{margin-bottom:4px}

/* ===== Lista (Planifica) ===== */
.ls-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.ls-sum div{background:var(--sf);border-radius:12px;padding:10px 8px;text-align:center}
.ls-sum b{display:block;font-size:var(--fs-l);font-weight:700;font-variant-numeric:tabular-nums}
.ls-sum span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.ls-sum .pend b{color:var(--ac-t)}
.ls-add{padding:0;margin-top:12px}
.sec-t small{font-weight:500;color:var(--mut2);margin-left:auto;text-align:right}
.sec-t .dot{width:10px;height:10px}
.sec-t.hot{color:var(--warn)}
.tr.ls{padding-right:8px}
.ls-ag{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:10px;background:var(--sf2);color:var(--mut);font-size:var(--fs-s);font-weight:600;font-variant-numeric:tabular-nums}
.ls-ag svg.i{width:15px;height:15px}
.ls-ag.pend{background:var(--ac-s);color:var(--ac-t)}
.ls-ag:active{transform:scale(.95)}
details.sec-d .bloc,details.sec-d #blocBox{margin-top:8px}

/* ===== Tablero ===== */
.tb-top{display:flex;gap:8px;align-items:center}
.tb-sum{flex:1;min-width:0}
.tb-sum b{display:block;font-size:var(--fs-m);font-weight:700}
.tb-sum span{display:block;font-size:var(--fs-s);color:var(--mut)}
.kc-enf{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ac-s);color:var(--ac-t)}
.kc-tm{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);font-weight:600}
.kc-tm b{font-size:var(--fs-l);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kc-bar{display:block;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ac) 20%,transparent);margin-top:6px;overflow:hidden}
.kc-bar i{display:block;height:100%;background:var(--ac);transition:width .5s linear}
.kc-tm{flex-wrap:wrap;gap:2px 8px}
.kc-f.pr{flex-wrap:wrap}
.kc-f.pr .mt{flex:1 1 100%;padding-bottom:0}
.kc-f.pr .mt:empty{display:none}
.kc-f.pr .qk.ok{flex:1;justify-content:center}
.filt{background:var(--sf3);border-radius:12px;width:44px;height:42px}
.filt.on{background:var(--ac-s);color:var(--ac-t)}
.coltabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;background:var(--sf3);border-radius:12px;padding:4px}
.coltabs button{min-height:50px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-s);font-weight:600;color:var(--mut);transition:all .2s var(--ease);text-align:center}
.coltabs b{font-size:var(--fs-s);min-width:22px;padding:0 8px;border-radius:8px;background:var(--sf);color:var(--ink);line-height:19px;font-weight:600}
.coltabs b.full{background:var(--ac-s);color:var(--ac-t)}
.coltabs button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.coltabs button.on b{background:var(--sf3)}
.coltabs button.on b.full{background:var(--ac-s)}
.board{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:0 16px;scrollbar-width:none;height:460px}
.board::-webkit-scrollbar{display:none}
body.dragging .board{scroll-snap-type:none}
.col{flex:0 0 min(84vw,330px);scroll-snap-align:start;scroll-margin-left:16px;display:flex;flex-direction:column;min-height:0;border-radius:16px;background:var(--sf3);transition:box-shadow .2s}
.col.over{box-shadow:0 0 0 2px var(--c)}
.col-h{padding:12px 16px 8px}
.col-h div{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-m)}
.col-h .cd{width:9px;height:9px;border-radius:50%;background:var(--c)}
.col-h .cnt{font-size:var(--fs-s);color:var(--mut);font-weight:600}
.col-h small{display:block;font-size:var(--fs-s);color:var(--mut);margin-top:2px}
.col .list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 80px;display:flex;flex-direction:column;gap:8px;min-height:60px;-webkit-overflow-scrolling:touch}
.list > .empty:not(:only-child){display:none}
.col .empty{border:2px dashed var(--ln2);border-radius:12px;padding:16px 12px;font-size:var(--fs-s)}
.kc{position:relative;background:var(--sf);border-radius:12px;padding:12px 12px 12px 16px;transition:opacity .3s,transform .3s var(--ease),box-shadow .2s;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}

.kc-t{font-weight:600;font-size:var(--fs-m);line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-right:4px}
.kc-f{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.kc-f .mt{flex:1;min-width:0;margin-top:0;padding-bottom:8px}
.qk{min-height:38px;padding:0 12px;border-radius:12px;background:var(--sf2);color:var(--ink);font-size:var(--fs-s);font-weight:600;display:inline-flex;align-items:center;gap:4px;flex:none}
.qk svg.i{width:15px;height:15px;stroke-width:2.2}
.qk.pri{background:var(--sf2);color:var(--ac-t)}
.qk.ok{background:var(--ok-s);color:var(--ok)}
.kc.hecha{opacity:.7}.kc.hecha .kc-t{text-decoration:line-through;color:var(--mut);font-weight:500}
.kc.run{box-shadow:var(--glow)}
.kc.done{opacity:.4}.kc.out{opacity:0;transform:scale(.95)}
.qadd{padding:0 8px 8px}
.qadd input{width:100%;min-height:44px;border-radius:12px;border:1.5px dashed var(--ln2);background:transparent;padding:0 12px;outline:none}
.qadd input:focus{border-style:solid;border-color:var(--ac);background:var(--sf)}
.bloc{columns:2;column-gap:12px;margin-top:12px}
.note{break-inside:avoid;margin-bottom:12px;border-radius:16px;padding:12px;background:color-mix(in srgb,var(--a,#888) 12%,var(--sf));display:block;color:var(--ink)}
.note .nt{font-weight:600;font-size:var(--fs-m);line-height:1.3;overflow-wrap:anywhere}
.note .nn{font-size:var(--fs-s);color:var(--mut);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .nm{display:flex;align-items:center;justify-content:space-between;gap:8px 8px;margin-top:12px;flex-wrap:wrap}
.note .qk{min-height:34px;font-size:var(--fs-s);background:var(--sf)}

/* ===== Enfoque ===== */
.enf{--k:var(--ac-t)}
.enf.fase-corto,.enf.fase-largo,.enf.fase-listo{--k:var(--ok)}
.enf-task{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px}
.enf-l{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.enf-tt{font-size:var(--fs-m);font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cyc{display:flex;gap:4px;margin-top:12px;max-width:160px}
.cyc i{flex:1;height:4px;border-radius:2px;background:var(--sf3)}
.cyc i.on{background:var(--ac)}
.cyc i.cur{background:linear-gradient(90deg,var(--ac) 50%,var(--sf3) 50%)}
.modes{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.modes .chip{min-height:36px;font-size:var(--fs-s)}
.ring-wrap{position:relative;width:min(62vw,246px);aspect-ratio:1;margin:16px auto 2px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fase{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--k)}
.tm{font-size:min(15vw,58px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.tm-sub{font-size:var(--fs-s);color:var(--mut);min-height:19px}
.tm-xp{font-size:var(--fs-s);font-weight:600;color:var(--k);display:flex;align-items:center;gap:4px;margin-top:4px;min-height:17px}
.tm-xp svg.i{width:14px;height:14px}
.durs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.durs .chip{min-height:36px;padding:0 12px;font-size:var(--fs-s)}
.ctl{display:flex;align-items:center;justify-content:center;gap:32px;margin:12px 0 2px}
.cbtn{width:56px;height:56px;border-radius:50%;background:var(--sf);display:grid;place-items:center;color:var(--ink);transition:transform .12s}
.cbtn:active{transform:scale(.92)}
.cbtn:disabled{opacity:.3}
.cbtn.big{width:78px;height:78px;background:var(--ac);color:var(--on-ac);box-shadow:var(--float)}
.enf.fase-corto .cbtn.big,.enf.fase-largo .cbtn.big{background:var(--ok-f);color:#fff}
.cbtn.big svg.i{width:30px;height:30px;stroke-width:2.8}
.ctl-l{display:flex;justify-content:center;gap:32px;font-size:var(--fs-s);color:var(--mut);margin-top:4px}
.ctl-l span{width:56px;text-align:center}
.ctl-l span:nth-child(2){width:78px}
.tomrow{display:flex;align-items:center;justify-content:center;gap:4px;margin:12px 0 0;color:var(--mut);font-size:var(--fs-s);font-weight:500;flex-wrap:wrap}
.tom{color:var(--mut2);display:grid}
.tom svg.i{width:18px;height:18px}
.tom.on{color:var(--hot-f)}
.tom.on svg.i{fill:color-mix(in srgb,var(--hot-f) 25%,transparent)}
.tom.new{animation:tpop .6s var(--ease)}
.tomrow > span:last-child{margin-left:8px}
@keyframes tpop{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.qcap{display:flex;gap:8px;align-items:center;margin-top:16px;padding:4px 4px 4px 16px;border-radius:24px;background:var(--sf);transition:box-shadow .2s}
.qcap:focus-within{box-shadow:0 0 0 2px var(--ac)}
.qcap > svg.i{color:var(--mut2)}
.qcap input{flex:1;min-width:0;border:0;background:none;outline:none;min-height:42px}
.qcap .cap-send,.bit-add .cap-send{background:var(--sf2);color:var(--ac-t);width:40px;height:40px}
.caps{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.caps div{font-size:var(--fs-s);color:var(--mut);display:flex;gap:8px;align-items:center;padding:2px 8px;animation:popin .3s var(--ease)}
.caps div span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.caps div em{flex:none;font-style:normal}
.caps svg.i{width:14px;height:14px;color:var(--ok)}
.done-card{text-align:center;margin-top:12px}
.done-card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* ===== Reproductor acoplado ===== */
#mini{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + var(--bot));z-index:45;height:var(--mini);display:none;align-items:center;gap:12px;padding:0 8px 0 16px;background:var(--sf);border-top:1px solid var(--ln)}
#mini.on{display:flex}
#mini .mbar{position:absolute;left:0;top:-1px;height:2px;background:var(--ac);transition:width .5s linear}
#mini.desc .mbar{background:var(--ok-f)}
#mini .mt2{flex:1;min-width:0}
#mini .mt2 b{display:block;font-size:var(--fs-m);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mt2 span{font-size:var(--fs-s);color:var(--mut)}
#mini .tmm{font-size:var(--fs-l);font-weight:600;font-variant-numeric:tabular-nums}
#mini .ib{color:var(--ink);width:42px;height:42px}
#mini .live{background:var(--mut2)}
#mini .live.on{background:var(--ok-f);}

/* ===== Progreso ===== */
.lvl{display:flex;align-items:center;gap:16px}
.lvl-badge{width:56px;height:56px;border-radius:999px;background:var(--ac-s);color:var(--ac-t);display:grid;place-items:center;font-size:var(--fs-l);font-weight:700;flex:none}
.lvl .ln{font-size:var(--fs-m);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--sf3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac);transition:width .6s var(--ease)}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{padding:12px}
.kpi .kv{font-size:var(--fs-l);font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.kpi .kv small{font-size:var(--fs-s);color:var(--mut);font-weight:600;margin-right:4px}
.kpi .kl{font-size:var(--fs-s);color:var(--mut);font-weight:600;margin-top:4px;display:flex;align-items:center;gap:4px}
.kpi .kl svg.i{width:14px;height:14px;stroke-width:2.2}
.kpi .ks{font-size:var(--fs-s);color:var(--mut2);margin-top:1px}
.ph-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ph-h h3{margin:0;font-size:var(--fs-m);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:12px}
.chart .cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .cv{font-size:var(--fs-s);font-weight:600;color:var(--mut);min-height:15px}
.chart .cbar{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--ac);opacity:.4;min-height:4px;transition:height .6s var(--ease)}
.chart .cbar.nul{background:var(--sf3);opacity:1}
.chart .cb{min-width:0}
.chart.mes .cd{font-size:11px}
.chart .cbar.hoy{opacity:1}
.chart .cd{font-size:var(--fs-s);font-weight:600;color:var(--mut)}
.chart .cd.hoy{color:var(--ink)}
.chart .ct{font-size:var(--fs-s);color:var(--ok);font-weight:600;display:flex;align-items:center;gap:1px;min-height:15px}
.chart .ct svg.i{width:11px;height:11px;stroke-width:3}
.acc{margin-top:12px;background:var(--sf);border-radius:var(--r)}
.acc > summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:58px;padding:0 12px;font-weight:600;font-size:var(--fs-m)}
.acc > summary::-webkit-details-marker{display:none}
.acc > summary .ai{width:34px;height:34px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;color:var(--mut)}
.acc > summary .ai svg.i{width:18px;height:18px}
.acc > summary .v{margin-left:auto;font-size:var(--fs-s);color:var(--mut);font-weight:500}
.acc > summary .chev{color:var(--mut2)}
.acc[open] > summary .chev{transform:rotate(180deg)}
.acc-b{padding:0 16px 16px}
.abar{padding:8px 0}
.abar + .abar{border-top:1px solid var(--ln)}
.abar .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-m)}
.abar .nm .v{margin-left:auto;font-size:var(--fs-s);color:var(--mut);font-weight:500}
.abar .tk2{height:6px;border-radius:3px;background:var(--sf3);margin-top:8px;overflow:hidden}
.abar .tk2 i{display:block;height:100%;border-radius:3px;background:var(--a)}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.in-b{text-align:center;padding:12px 4px;border-radius:12px;background:var(--sf2)}
.in-b .o{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--ac-s);color:var(--ac-t)}
.in-b.off .o{background:var(--sf3);color:var(--mut2)}
.in-b b{display:block;font-size:var(--fs-s);line-height:1.2;font-weight:600}
.in-b span{display:block;font-size:var(--fs-s);color:var(--mut);margin-top:4px;line-height:1.25}
.in-b.off b{color:var(--mut)}
.h-day{font-size:var(--fs-s);font-weight:600;color:var(--mut);margin:16px 2px 4px;text-transform:capitalize}
.hr{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);width:100%}
.hr:last-child{border-bottom:0}
.hr .dot{margin-top:8px}
.hr .ht{font-size:var(--fs-m);font-weight:600}
.hr .hn{font-size:var(--fs-s);color:var(--mut);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hr .hm{font-size:var(--fs-s);color:var(--mut);white-space:nowrap;margin-left:auto;padding-left:8px;display:flex;align-items:center;gap:4px}
.hr .hm svg.i{width:13px;height:13px;color:var(--hot-f)}
.rec-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.rec-row:last-child{border-bottom:0}
.rec-row .ri{width:34px;height:34px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;color:var(--mut);flex:none}
.rec-row .ri svg.i{width:16px;height:16px}
.rec-row b{display:block;font-size:var(--fs-m);font-weight:600}
.rec-row span span{font-size:var(--fs-s);color:var(--mut)}

/* ===== Hojas inferiores ===== */
#sheetBg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;cursor:pointer}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{--dy:0px;position:fixed;left:0;right:0;bottom:0;z-index:210;max-height:calc(100dvh - var(--top) - 44px);display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(calc(100% + 40px));transition:transform .34s var(--ease),visibility 0s linear .34s;box-shadow:0 -10px 40px rgba(0,0,0,.22);visibility:hidden}
#sheet.on{transform:translateY(var(--dy));visibility:visible;transition:transform .34s var(--ease),visibility 0s}
#sheetBody{overflow-y:auto;overscroll-behavior:contain;padding:0 16px;-webkit-overflow-scrolling:touch;flex:1}
.sh-top{position:sticky;top:0;z-index:3;margin:0 -16px 8px;padding:0 8px 4px 16px;background:var(--bg);touch-action:none}
.sh-top .grab{height:22px;display:grid;place-items:center;margin-right:8px;cursor:pointer}
.sh-top .grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--ln2)}
.sh-row{display:flex;align-items:center;gap:12px;min-height:46px}
.sh-row h2{margin:0;font-size:var(--fs-l);font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.sh-row .x{background:var(--sf3);border-radius:50%;width:36px;height:36px;color:var(--mut)}
.sh-row .x svg.i{width:18px;height:18px;stroke-width:2.4}
.sh-row .x:focus-visible{outline-offset:-2px}
.sh-foot{position:sticky;bottom:0;z-index:3;display:flex;gap:8px;margin:16px -16px 0;padding:12px 16px calc(12px + var(--bot));background:var(--bg);border-top:1px solid var(--ln)}
.sh-foot .btn{flex:1}
.sh-foot .btn.sq{flex:none}
.sh-end{height:calc(24px + var(--bot))}
.pill{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 12px;border-radius:999px;font-size:var(--fs-s);font-weight:600;background:var(--sf2);color:var(--mut)}
.pill.ac{background:var(--ac-s);color:var(--ac-t)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.vio{background:var(--vio-s);color:var(--vio)}.pill.ok{background:var(--ok-s);color:var(--ok)}
.saved{font-size:var(--fs-s);color:var(--ok);font-weight:600;opacity:0;transition:opacity .4s;display:inline-flex;gap:4px;align-items:center}
.saved svg.i{width:14px;height:14px;stroke-width:2.6}
.saved.on{opacity:1}
.saved.run{color:var(--mut)}
.saved.err{color:var(--hot)}
.dt-title{display:block;width:100%;border:0;outline:0;background:var(--sf);border-radius:var(--r);resize:none;font-size:var(--fs-l);font-weight:600;line-height:1.3;padding:16px;margin:0 0 16px}
.dt-title:focus{box-shadow:0 0 0 2px var(--ac)}
.dr + .dr{border-top:1px solid var(--ln)}
.dr-h{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 12px 8px 16px;text-align:left}
.dr-h:active{background:var(--sf2)}
.dr-i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sf3);color:var(--mut);flex:none}
.dr-i svg.i{width:17px;height:17px}
.dr-i{background:transparent!important;color:var(--mut)!important;width:24px}
.dr-l{font-size:var(--fs-m);flex:none}
.dr-v{flex:1;min-width:0;text-align:right;color:var(--mut);font-size:var(--fs-m);display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-h .chev{color:var(--mut2);width:17px;height:17px}
.dr.open .dr-h .chev{transform:rotate(180deg)}
.dr-b{padding:4px 16px 16px;animation:popin .25s var(--ease)}
.dr-b .chips{gap:8px}
.dr-b .hint{margin:8px 2px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dt-meta{font-size:var(--fs-s);color:var(--mut);margin:12px 4px 0;text-align:center}
.bit{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.bit-i{background:var(--sf);border-radius:12px;padding:12px 12px;font-size:var(--fs-m);overflow-wrap:anywhere}
.bit-i small{display:block;font-size:var(--fs-s);color:var(--mut);margin-bottom:2px}
.bit-add{display:flex;gap:8px;align-items:flex-end;border-radius:12px}
.bit-add .in{background:var(--sf)}
.days{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.days button{width:40px;height:40px;border-radius:50%;background:var(--sf2);font-weight:600;font-size:var(--fs-s);color:var(--mut)}
.days button.on{background:var(--ac-s);color:var(--ac-t);box-shadow:inset 0 0 0 1.5px var(--ac)}
.tr.pl{border:0;text-align:left}
.tr.pl.on .ck{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.pl-cnt{font-weight:700;font-size:var(--fs-m);color:var(--ac-t);padding:0 8px}
.set-r{position:relative;display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;width:100%;text-align:left}
.set-r + .set-r{border-top:1px solid var(--ln)}
.set-r .sl{flex:1;font-size:var(--fs-m)}
.set-r .sl small{display:block;font-size:var(--fs-s);color:var(--mut)}
.set-r > svg.i{color:var(--mut2)}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:38px;height:38px;border-radius:12px;background:var(--sf2);font-size:var(--fs-l);font-weight:600;text-align:center}
.stp button:disabled{opacity:.35}
.stp b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;background:var(--sf3);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw.on{background:var(--ok-f)}
.sw.on::after{transform:translateX(20px)}
.ar-r{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 8px 0 16px}
.ar-r + .ar-r{border-top:1px solid var(--ln)}
.ar-r input[type=text]{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 0}
.sw-c{position:relative;width:30px;height:30px;border-radius:8px;background:var(--a);flex:none;overflow:hidden}
.sw-c{display:block;border:0;padding:0}
.ar-r .cnt{font-size:var(--fs-s);color:var(--mut);white-space:nowrap}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:4px 16px 16px}
.pal button{aspect-ratio:1;border-radius:50%;background:var(--c);position:relative;max-width:40px;justify-self:center;width:100%}
.pal button.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--c)}
.ar-new{padding:16px;border-top:1px solid var(--ln)}
.ar-new .pal{padding:12px 0 2px}
.ar-new .row{display:flex;gap:8px;margin-top:12px}
.ar-new .row .btn{flex:1}
.opt{text-align:left}
.opt .tt{-webkit-line-clamp:1}
.st-big{display:flex;align-items:center;gap:16px}
.st-big .o{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.st-big .o svg.i{width:28px;height:28px}
.st-big b{display:block;font-size:var(--fs-m);font-weight:600}
.st-big span{font-size:var(--fs-s);color:var(--mut)}
.help-i{display:flex;gap:12px;padding:12px 0}
.help-i + .help-i{border-top:1px solid var(--ln)}
.help-i .o{width:34px;height:34px;border-radius:8px;background:var(--ac-s);color:var(--ac-t);display:grid;place-items:center;flex:none}
.help-i .o svg.i{width:18px;height:18px}
.help-i b{display:block;font-size:var(--fs-m);font-weight:600}
.help-i span{font-size:var(--fs-s);color:var(--mut);line-height:1.45}
.help-d{font-size:var(--fs-m);line-height:1.5;margin:0 2px 12px}

/* ===== Guía inicial ===== */
#onb{position:fixed;inset:0;z-index:550;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--top) + 12px) 24px calc(24px + var(--bot))}
#onb.on{display:flex;animation:vin .3s var(--ease)}
.onb-top{display:flex;justify-content:flex-end;min-height:44px}
.onb-top button{color:var(--ac-t);font-weight:600;padding:12px 4px}
.onb-flow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px}
.onb-flow .fs{display:flex;flex-direction:column;align-items:center;gap:8px;width:62px;font-size:var(--fs-s);font-weight:600;color:var(--mut2);transition:color .3s}
.onb-flow .fs i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sf3);transition:all .3s var(--ease)}
.onb-flow .fs svg.i{width:22px;height:22px}
.onb-flow .fs.on{color:var(--ac-t)}
.onb-flow .fs.on i{background:var(--ac);color:#fff;transform:scale(1.1)}
.onb-flow .fs.ya i{background:var(--ac-s);color:var(--ac-t)}
.onb-flow > svg.i{width:14px;height:14px;color:var(--mut2);margin-bottom:24px}
.onb-art{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0 4px}
.onb-art .big{width:116px;height:116px;margin:0 auto 24px;border-radius:32px;background:var(--ac-s);color:var(--ac-t);display:grid;place-items:center;animation:penter .45s var(--ease)}
.onb-art .big svg.i{width:54px;height:54px;stroke-width:1.7}
.onb-art small{font-size:var(--fs-s);font-weight:600;color:var(--ac-t)}
.onb-art h2{margin:8px 0 12px;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em}
.onb-art p{margin:0 auto;font-size:var(--fs-m);line-height:1.5;color:var(--mut);max-width:330px}
.onb-dots{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.onb-dots i{width:8px;height:8px;border-radius:4px;background:var(--sf3);transition:all .3s}
.onb-dots i.on{width:22px;background:var(--ac)}

/* ===== Diálogo ===== */
#dlg{position:fixed;inset:0;z-index:600;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.4)}
#dlg.on{display:grid;animation:vin .2s}
.dlg-box{width:min(100%,340px);background:var(--sf);border-radius:24px;padding:24px;box-shadow:var(--float);animation:penter .3s var(--ease)}
.dlg-box h3{margin:0;font-size:var(--fs-l);font-weight:700}
.dlg-box p{margin:8px 0 0;color:var(--mut);font-size:var(--fs-m);line-height:1.45}
.dlg-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.dlg-b.col{grid-template-columns:1fr}

/* ===== Avisos y celebraciones ===== */
#toast{position:fixed;left:50%;bottom:calc(var(--tabs) + 76px + var(--bot));z-index:400;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 12px 12px 16px;font-size:var(--fs-m);font-weight:500;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--float);transition:all .3s var(--ease)}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast.on button{pointer-events:auto}
#toast > span{padding:2px 4px 2px 0}
#toast button{background:var(--ac);color:var(--on-ac);font-weight:600;font-size:var(--fs-s);padding:8px 12px;border-radius:8px;flex:none}
#toast svg.i{width:18px;height:18px;color:var(--warn-f)}
body.has-mini #toast{bottom:calc(var(--tabs) + var(--mini) + 76px + var(--bot))}
body.no-fab #toast{bottom:calc(var(--tabs) + 16px + var(--bot))}
html.lock #toast{bottom:auto!important;top:calc(var(--top) + 8px);transform:translate(-50%,-24px)}
html.lock #toast.on{transform:translate(-50%,0)}
body.no-fab.has-mini #toast{bottom:calc(var(--tabs) + var(--mini) + 16px + var(--bot))}
.xpf{position:fixed;z-index:450;pointer-events:none;font-weight:700;font-size:var(--fs-l);color:var(--ac-t);animation:xpup 1.3s var(--ease) forwards}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
.cf{position:fixed;top:-12px;z-index:500;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cfall var(--d) cubic-bezier(.3,.6,.4,1) forwards}
@keyframes cfall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
#lvlUp{position:fixed;inset:0;z-index:480;display:none;place-items:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#lvlUp.on{display:grid;animation:vin .3s}
#lvlUp .box{background:var(--sf);border-radius:24px;padding:32px 24px;text-align:center;width:min(86vw,320px);animation:penter .5s var(--ease)}
#lvlUp .lvl-badge{margin:0 auto 16px;width:84px;height:84px;font-size:var(--fs-xl);border-radius:24px}
#lvlUp h2{margin:0;font-size:var(--fs-l);font-weight:700}
#lvlUp p{color:var(--mut);margin:8px 0 16px}

@media (min-width:700px){
  main{max-width:760px;margin:0 auto}
  #hdr{padding-left:max(16px,calc(50% - 368px));padding-right:max(8px,calc(50% - 376px))}
  #sheet{left:50%;right:auto;width:560px;transform:translate(-50%,calc(100% + 40px))}
  #sheet.on{transform:translate(-50%,var(--dy))}
  .bloc{columns:3}
}
/* ===== Escritorio: barra lateral, paneles lado a lado y semana en columnas ===== */
#tabs .brand,#tabs .side-f,#tabs kbd{display:none}
.sm-it.dragging,.tl-b.dragging{opacity:.4}
@media (min-width:1024px){
  :root{--side:232px;--tabs:0px}
  body{padding-left:var(--side)}
  main{max-width:1440px;margin:0;padding:4px 32px 48px}
  #hdr{padding-left:32px;padding-right:24px}
  #tabs{top:0;right:auto;width:var(--side);flex-direction:column;gap:4px;padding:calc(var(--top) + 12px) 12px 16px;border-top:0;border-right:1px solid var(--ln);background:var(--sf)}
  #tabs .brand{display:flex;align-items:center;gap:12px;padding:4px 12px 20px;font-size:var(--fs-l);font-weight:700;letter-spacing:-.01em}
  #tabs .brand img{border-radius:8px}
  #tabs button{flex:none;flex-direction:row;justify-content:flex-start;min-height:44px;padding:0 12px;gap:12px;font-size:var(--fs-m);border-radius:12px;transition:background .15s}
  #tabs button:hover{background:var(--sf2)}
  #tabs button.on{background:var(--ac-s)}
  #tabs .tp{width:auto;height:auto;background:none!important}
  #tabs .tp svg.i{width:20px;height:20px}
  #tabs .tl{flex:1;text-align:left}
  #tabs .bdg,#tabs .tdot{position:static;margin:0}
  #tabs kbd,.side-f kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--sf2);border:1px solid var(--ln);font:600 12px/1 inherit;color:var(--mut)}
  #tabs .tcap{order:0;margin:0 0 12px;background:var(--ac);color:var(--on-ac)}
  #tabs .tcap:hover{background:color-mix(in srgb,var(--ac) 88%,#000)}
  #tabs .tcap .tp{width:auto;height:auto;border-radius:0;background:none;box-shadow:none;color:inherit}
  #tabs .tcap .tp svg.i{width:20px;height:20px}
  #tabs .tcap .tl{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  #tabs .tcap kbd{background:color-mix(in srgb,var(--on-ac) 18%,transparent);border-color:transparent;color:var(--on-ac)}
  #tabs > button{order:1}
  /* El atajo de cada sección solo aparece al pasar el cursor: no compite con el contador de la Bandeja */
  #tabs > button:not(.tcap) > kbd{opacity:0;transition:opacity .15s}
  #tabs > button:not(.tcap):hover > kbd,#tabs > button:not(.tcap):focus-visible > kbd{opacity:1}
  body.inmersivo #hdr{padding-left:max(32px,calc(50% - 360px));padding-right:max(24px,calc(50% - 368px))}
  .sh-top{padding-top:12px}
  .sh-top .grab{display:none}
  body.inmersivo{padding-left:0}
  body.inmersivo main{margin:0 auto;max-width:720px}
  #tabs .side-f{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--ln);font-size:var(--fs-s);color:var(--mut)}
  .side-f b{font-weight:600;color:var(--ink)}
  .side-f span{display:flex;align-items:center;gap:4px}.side-f span kbd:last-of-type{margin-right:6px}
  #mini{left:var(--side)}
  #fab{bottom:calc(24px + var(--bot))}
  body.has-mini #fab{bottom:calc(var(--mini) + 24px)}
  #toast{left:calc(50% + var(--side) / 2)}
  .subnav{display:inline-flex;min-width:360px}
  .subnav.hide{display:none}
  /* Hojas: panel lateral a la derecha */
  #sheet,#sheet.on{left:auto;right:0;top:0;bottom:0;width:480px;max-height:none;border-radius:24px 0 0 24px}
  #sheet{transform:translateX(calc(100% + 40px))}
  #sheet.on{transform:translateX(0)}
  #proc,#onb{padding-left:max(24px,calc(50% - 320px));padding-right:max(24px,calc(50% - 320px))}
  /* Ingresa: captura a la izquierda, lista a la derecha */
  #v-bandeja.on{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);column-gap:32px;align-items:start}
  #v-bandeja>*{grid-column:1}
  #v-bandeja>#bandejaZona{grid-column:2;grid-row:1 / span 5}
  #bandejaZona>.sec-t:first-of-type{margin-top:24px}
  #bandejaZona>:first-child{margin-top:0}
  /* Ejecuta: tarea actual a la izquierda, avance y lista a la derecha */
  .hoy-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a t" "a b";column-gap:32px;align-items:start}
  .hoy-t{grid-area:t}.hoy-b{grid-area:b}
  .hoy-a{grid-area:a;position:sticky;top:96px}
  .hoy-a>.hero:first-child,.hoy-a>.panel.zero:first-child{margin-top:0!important}
  .hoy-a .hero{padding:32px 28px 28px}
  .hoy-a .hero-t{font-size:26px}
  #v-enfoque,#v-progreso{max-width:720px}
  #v-lista{max-width:880px}
  /* Tablero: todas las columnas a la vista */
  .coltabs{display:none}
  .board{margin:12px 0 0;padding:0 0 8px;overflow-x:auto;scroll-snap-type:none;scrollbar-width:thin}
  .col{flex:1 1 0;min-width:208px;max-width:340px}
  /* Planifica: semana en columnas */
  .semana{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
  .sm-side{position:sticky;top:96px}
  .sm-nav{display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;background:var(--sf)}
  .sm-nav b{flex:1;text-align:center;font-size:var(--fs-m);font-weight:600}
  .sm-nav .ib:disabled{opacity:.3}
  .sm-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

// Sustantivo-objeto → verbo sugerido (se antepone): «Junta con Omar» → «Preparar junta con Omar»
const OBJETO_N = { junta:'Preparar', reunion:'Preparar', presentacion:'Preparar', factura:'Facturar', reporte:'Elaborar', informe:'Elaborar', contrato:'Revisar', propuesta:'Elaborar', campana:'Revisar', video:'Grabar', post:'Publicar' };
const NO_VERBO = new Set(['lugar','hogar','mar','bar','azucar','collar','altar','par','pilar','dolar','militar','familiar','particular','popular','similar','regular','titular','celular','solar','polar','escolar','lunar','alfiler','ayer','mujer','taller','placer','cancer','caracter','cadaver','alquiler','poster','computer','super','elixir','tapir','faquir','omar','edgar','oscar','baltazar','aguilar','escobar','salazar','javier','esther','walter','peter','oliver','jennifer','jasmir','yamir','bolivar','azar','cesar','sauver','mostrar?']);

function verbosTodos() { return [...new Set([...(S.ajustes.verbos || []), ...VERBOS_BASE])]; }
function cap1(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function limpiarTitulo(s) { return cap1(String(s).replace(/\s+/g, ' ').trim().replace(/[.;,]+$/, '').trim()).slice(0, MAX_TITULO); }

function bajarInicial(resto) {

// Revisa un título y devuelve, por prioridad, lo que conviene aclarar.
function analizar(texto) {

function sonido(tipo) {

  audioListo(); if (!actx) return;
  const notas = { foco:[784, 988, 1175, 1568], descanso:[1175, 880, 660], nivel:[523, 659, 784, 1047, 1319] }[tipo] || [880];
  const t0 = actx.currentTime + .02;

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .45);
  });
}
function sonidoCheck() {
  if (!S.ajustes.sonido) return; audioListo(); if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;

}

  const rec = planDe(hoy());

  const esPrio = t => !prioIds || prioIds.includes(t.id);

  const proceso = tareasEn('proceso').sort(byOrden);

  const otras = prioIds ? delDia.filter(t => t.estado === 'hoy' && !esPrio(t)).sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99') || byOrden(a, b)) : [];

  dias.forEach(d => {
    const r = planDe(d);

function aplicarTema(t) {
  const r = document.documentElement;
  if (t === 'light' || t === 'dark') r.dataset.theme = t; else { delete r.dataset.theme; t = 'auto'; }
  pref.set('tema', t);
  const oscuro = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $$('meta[name="theme-color"]').forEach((m, i) => { m.content = t === 'auto' ? (i ? '#111113' : '#F0F0F3') : (oscuro ? '#111113' : '#F0F0F3'); });
}

// al cerrar la ficha o abrir otra, para que nada se pierda ni caiga en otra tarea.
const debs = {};
const deb = (k, fn, ms = 500) => { if (debs[k]) clearTimeout(debs[k].t); debs[k] = { fn, t:setTimeout(() => { delete debs[k]; fn(); }, ms) }; };
function flushDebs(prefijo = '') { Object.keys(debs).filter(k => k.startsWith(prefijo)).forEach(k => { const d = debs[k]; clearTimeout(d.t); delete debs[k]; d.fn(); }); }
