  if (e.key === 'Escape') { if ($('#dlg').classList.contains('on')) return; if (ui.sheet) cerrarSheet(); else if ($('#proc').classList.contains('on')) cerrarProc(); else if ($('#onb').classList.contains('on')) cerrarOnb(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.a && !/INPUT|TEXTAREA|BUTTON/.test(el.tagName)) { e.preventDefault(); el.click(); return; }
  // Con una hoja abierta, el tabulador recorre solo sus controles.
  if (e.key === 'Tab' && ui.sheet) {
    const f = $$('#sheet button:not([disabled]), #sheet input, #sheet textarea, #sheet select, #sheet [tabindex="0"]').filter(x => x.offsetParent !== null);
    if (f.length) { const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i === f.length - 1 || i < 0)) { e.preventDefault(); f[0].focus(); } }
  }
  // Atajos de teclado (fuera de campos de texto y sin ventanas abiertas).
  const libre = !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(el.tagName) && !el.isContentEditable
    && !ui.sheet && !['#proc', '#onb', '#dlg'].some(s => $(s).classList.contains('on'));
  if (libre) {
    const k = e.key.toLowerCase();
    if (['1', '2', '3', '4'].includes(k)) { const g = GRUPOS[+k - 1]; e.preventDefault(); ir(g.k === 'hoy' ? 'hoy' : ui.ult[g.k] || g.vs[0]); return; }
    if (k === '/') { e.preventDefault(); abrirSheet({ k:'buscar' }); return; }
    if (k === 'f') { e.preventDefault(); ir('enfoque'); return; }
    if (k === 'n') { e.preventDefault(); if (ui.view === 'bandeja') $('#capIn')?.focus(); else abrirSheet({ k:'captura' }); return; }
    if (k === ' ' && el.tagName !== 'BUTTON' && (enMarcha() || ui.view === 'enfoque')) { e.preventDefault(); if (T().corriendo) pausar(); else iniciar(); return; }
  }
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (el.id === 'capIn') { e.preventDefault(); ACT.capAdd(); }
  else if (el.id === 'capSheetIn') { e.preventDefault(); ACT.capSheetAdd(); }
  else if (el.id === 'blocIn') { e.preventDefault(); ACT.blocAdd(); }
  else if (el.id === 'bitIn') { e.preventDefault(); ACT.bitAdd(); }
  else if (el.id === 'enfCap') { e.preventDefault(); ACT.enfCapAdd(); }
  else if (el.id === 'pEsperaIn') { e.preventDefault(); ACT.pGuardarEsp(); }
  else if (el.id === 'cfgClave') { e.preventDefault(); ACT.cfgGuardar(); }
  else if (el.id === 'areaNuevaN') { e.preventDefault(); ACT.areaNuevaOk(); }
  else if (el.id === 'verboQ') {
    e.preventDefault();
    const q = norm(el.value.trim()); if (!q) return;
    const ex = verbosTodos().find(v => norm(v) === q) || (verbosTodos().filter(v => norm(v).includes(q)).length === 1 && verbosTodos().find(v => norm(v).includes(q)));
    if (ex) ACT.verboSel({ dataset:{ v:ex } }); else ACT.verboNuevo();
  }
  else if (el.id === 'qaddIn') {
    e.preventDefault();
    const v = el.value.trim(); if (!v) { sacudir(el); return; }
    const { creadas, repetidas } = capturar(v, 'prox', ctxCaptura());
    if (repetidas.length && !creadas.length) toast('Esa tarea ya existe');
    renderVista(); setTimeout(() => $('#qaddIn')?.focus(), 30);
  }
  else if (el.classList.contains('dt-title') || el.id === 'procTt') { e.preventDefault(); el.blur(); }
});

/* ================= Arrastrar con el dedo =================
   Hoy: solo desde el asa de puntos (no estorba al tocar la tarjeta).
   Tablero y Agenda: mantener presionado. */
function dInicio(e, p) {
  if (D.st) return;
  if (e.target.closest('#sheet,#proc,#lvlUp,#mini,#onb,#dlg')) return;
  const item = e.target.closest('[data-drag]'); if (!item) return;
  const grip = !!e.target.closest('[data-grip]');
  if (!grip && (item.dataset.drag === 'grip' || e.target.closest('button,input,textarea,select'))) return;
  const tactil = e.type === 'touchstart';
  const st = D.st = { item, x0:p.clientX, y0:p.clientY, x:p.clientX, y:p.clientY, lifted:false, tactil, grip };
  if (!grip) st.timer = setTimeout(() => levantar(st), tactil ? 320 : 9999);
}
function levantar(st) {
  if (D.st !== st || st.lifted) return;
  const it = st.item, r = it.getBoundingClientRect();
  st.lifted = true; st.free = it.hasAttribute('data-free');
  st.origen = it.parentElement.dataset.list; st.enBoard = !!it.closest('.board');
  document.body.classList.add('dragging');
  if (navigator.vibrate) navigator.vibrate(12);
  if (st.free) { st.wrap = it.closest('.tl-wrap'); st.top0 = it.offsetTop; st.yL = st.y; st.sy0 = st.wrap ? st.wrap.scrollTop : scrollY; it.classList.add('lift'); }
  else {
    const g = it.cloneNode(true); g.classList.add('drag-ghost'); g.removeAttribute('data-drag');
    g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    document.body.appendChild(g); st.g = g; st.dx = st.x - r.left; st.dy = st.y - r.top;
    it.classList.add('ph');
  }
  st.raf = requestAnimationFrame(() => bucle(st));
}
function dMover(e) {
  const st = D.st; if (!st) return;
  const p = e.touches ? e.touches[0] : e;
  st.x = p.clientX; st.y = p.clientY;
  if (!st.lifted) {
    const dist = Math.hypot(st.x - st.x0, st.y - st.y0);
    if (st.grip) { if (e.cancelable) e.preventDefault(); if (dist > 3) levantar(st); return; }
    if (!st.tactil && dist > 6) { clearTimeout(st.timer); levantar(st); }
    else if (st.tactil && dist > 9) { clearTimeout(st.timer); D.st = null; }
    return;
  }
  if (e.cancelable) e.preventDefault();
  mover(st);
}
function mover(st) {
  if (st.free) {
    const it = st.item, maxTop = (AG_FIN - AG_INI) * 60 - it.offsetHeight;
    const sc = st.wrap ? st.wrap.scrollTop : scrollY;
    const nt = clamp(Math.round((st.top0 + (st.y - st.yL) + (sc - st.sy0)) / 15) * 15, 0, maxTop);
    it.style.top = nt + 'px'; st.nt = nt;
    const t = byId(it.dataset.id), ini = AG_INI * 60 + nt;
    const lbl = $('.tl-t', it); if (lbl && t) lbl.textContent = `${min2hm(ini)} – ${min2hm(ini + Math.max(+t.dur || 30, 15))}`;
    return;
  }
  st.g.style.left = (st.x - st.dx) + 'px'; st.g.style.top = (st.y - st.dy) + 'px';
  colocar(st);
}
function colocar(st) {
  const el = document.elementFromPoint(st.x, st.y); if (!el) return;
  const list = el.closest('[data-list]');
  $$('.hero.over').forEach(h => h.classList.remove('over')); st.top = false;
  if (!list) return;
  if (list.dataset.list === 'hoytop') { if (!st.enBoard && st.origen === 'hoy') { st.top = true; list.classList.add('over'); } return; }
  if (!st.enBoard && list.dataset.list !== st.origen) return;
  $$('.col.over').forEach(c => c.classList.remove('over'));
  const col = list.closest('.col'); if (col) col.classList.add('over');
  const items = $$(':scope > [data-drag]', list).filter(n => n !== st.item);
  let antes = null;
  for (const n of items) { const r = n.getBoundingClientRect(); if (st.y < r.top + r.height / 2) { antes = n; break; } }
  const ref = antes || $(':scope > .empty', list);
  if (ref) { if (st.item.nextElementSibling !== ref || st.item.parentElement !== list) list.insertBefore(st.item, ref); }
  else if (st.item.parentElement !== list || st.item.nextElementSibling) list.appendChild(st.item);
}
function bucle(st) {
  if (D.st !== st || !st.lifted) return;
  let movio = false;
  const board = $('#board');
  if (board && st.enBoard && !st.free) {
    const r = board.getBoundingClientRect();
    const z = 44; // más cerca del borde, más rápido
    if (st.x < r.left + z && board.scrollLeft > 0) { board.scrollLeft -= Math.ceil((r.left + z - st.x) / z * 10); movio = true; }
    else if (st.x > r.right - z) { board.scrollLeft += Math.ceil((st.x - (r.right - z)) / z * 10); movio = true; }
  }
  const list = st.item.parentElement;
  if (st.free && st.wrap) {
    const r = st.wrap.getBoundingClientRect();
    if (st.y < r.top + 40) { st.wrap.scrollTop -= 8; movio = true; } else if (st.y > r.bottom - 40) { st.wrap.scrollTop += 8; movio = true; }
  } else if (!st.free && st.enBoard && list && list.scrollHeight > list.clientHeight + 2) {
    const r = list.getBoundingClientRect();
    if (st.y < r.top + 44) { list.scrollTop -= 8; movio = true; } else if (st.y > r.bottom - 44) { list.scrollTop += 8; movio = true; }
  } else {
    if (st.y < 110) { scrollBy(0, -9); movio = true; } else if (st.y > innerHeight - 150) { scrollBy(0, 9); movio = true; }
  }
  if (movio) mover(st);
  st.raf = requestAnimationFrame(() => bucle(st));
}
function dFin() {
  const st = D.st; if (!st) return;
  clearTimeout(st.timer);
  if (!st.lifted) { D.st = null; return; }
  cancelAnimationFrame(st.raf);
  D.justDragged = true; setTimeout(() => D.justDragged = false, 400);
  document.body.classList.remove('dragging');
  $$('.col.over,.hero.over').forEach(c => c.classList.remove('over'));
  if (st.free) {
    st.item.classList.remove('lift'); D.st = null;
    if (st.nt != null) { const t = byId(st.item.dataset.id), ph = t.hora; t.hora = min2hm(AG_INI * 60 + st.nt); upsertT(t); renderVista(); toast(`Movida a las ${t.hora}`, 'Deshacer', () => { t.hora = ph; upsertT(t); renderVista(); }); }
    return;
  }
  if (st.top) { st.g.remove(); st.item.classList.remove('ph'); D.st = null; hacerPrimera(st.item.dataset.id); return; }
  const r = st.item.getBoundingClientRect();
  st.g.style.transition = 'left .18s var(--ease),top .18s var(--ease),transform .18s';
  st.g.style.left = r.left + 'px'; st.g.style.top = r.top + 'px'; st.g.style.transform = 'none';
  setTimeout(() => {
    st.g.remove(); st.item.classList.remove('ph'); D.st = null;
    const list = st.item.parentElement;
    soltar(st.item.dataset.id, list.dataset.list, $$(':scope > [data-drag]', list).map(n => n.dataset.id), st.item, list);
  }, 190);
}
function soltar(id, destino, ids, el, list) {
  const t = byId(id); if (!t) return;
  if (destino !== t.estado) {
    if (destino === 'hecho') completar(t, el);
    else {
      const otra = destino === 'proceso' ? tareasEn('proceso').find(o => o.id !== id) : null;
      if (destino === 'espera' && !t.espera) setTimeout(() => toast('Anota de quién esperas', 'Anotar', () => abrirSheet({ k:'detalle', id, open:'esp' })), 300);
      setEstado(t, destino);
      if (destino === 'proceso' && !T().corriendo) { T().tareaId = t.id; save(); pushTimer(); }
      if (otra) toast(`«${otra.titulo}» regresó a Hoy. Una tarea a la vez.`);
    }
  }
  if (destino !== 'hecho') {
    const base = +(list && list.dataset.base) || 0;
    if (list && list.dataset.hero) { const h = byId(list.dataset.hero); if (h && +h.orden !== 0) { h.orden = 0; upsertT(h); } }
    ids.forEach((x, i) => { const o = byId(x); if (o && +o.orden !== base + i) { o.orden = base + i; upsertT(o); } });
  }
  renderVista();
}
document.addEventListener('touchstart', e => { if (e.touches.length === 1) dInicio(e, e.touches[0]); }, { passive:true });
document.addEventListener('mousedown', e => { if (e.button === 0) dInicio(e, e); });
document.addEventListener('touchmove', dMover, { passive:false });
document.addEventListener('mousemove', dMover);
document.addEventListener('touchend', dFin); document.addEventListener('touchcancel', dFin);
document.addEventListener('mouseup', dFin);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });

/* Deslizar hacia abajo para cerrar la hoja */
(() => {
  const sh = $('#sheet'), body = $('#sheetBody');
  let y0 = null, x0 = 0, dy = 0, activo = false, desdeCab = false;
  sh.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { y0 = null; return; }
    const t = e.target;
    desdeCab = !!t.closest('.sh-top');
    if (!desdeCab && (t.closest('input,textarea,select') || body.scrollTop > 0)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; activo = false;
  }, { passive:true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const d = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    if (!activo) {
      if (d > 8 && d > dx * 1.2 && (desdeCab || body.scrollTop <= 0)) { activo = true; sh.style.transition = 'none'; }
      else { if (d < -6 || dx > 12) y0 = null; return; }
    }
    dy = Math.max(0, d - 8);
    sh.style.setProperty('--dy', dy + 'px');
    if (e.cancelable) e.preventDefault();
  }, { passive:false });
  const fin = () => {
    if (y0 == null) return;
    sh.style.transition = '';
    if (activo && dy > 90) cerrarSheet(); else sh.style.setProperty('--dy', '0px');
    y0 = null; activo = false; dy = 0;
  };
  sh.addEventListener('touchend', fin); sh.addEventListener('touchcancel', fin);
  $('#sheetBg').addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive:false });
})();

/* ================= Inicio ================= */
function arrancar() {
  const pend = new Set(S.cola.map(o => o.fila.id));
  S.tareas = S.tareas.filter(t => !(t.borrado && !pend.has(t.id) && Date.now() - new Date(t.actualizado) > 30 * 864e5));
  rollover();
  if (S.insVistas === null) revisarLogros();
  const q = new URLSearchParams(location.search);
  // Pantalla inicial: Hoy por defecto, o la última vista si así lo eligió. Sin tareas, la Bandeja para capturar la primera.
  const ult = pref.v('ultVista');
  if (pref.v('inicio') === 'ultima' && ult && ult !== 'enfoque' && VISTAS.some(x => x.k === ult)) ui.view = ult;
  if (!vivas().length) ui.view = 'bandeja';
  if (q.get('v') && VISTAS.some(x => x.k === q.get('v'))) ui.view = q.get('v');
  if (ui.view === 'tablero' && mqMovil.matches) ui.view = 'lista';
  ui.ult[grupoDe(ui.view).k] = ui.view;
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + ui.view));
  estadoS = S.conn.url ? (S.cola.length ? 'pend' : 'ok') : 'sin';
  $('#gearBtn').innerHTML = ic('gear'); $('#searchBtn').innerHTML = ic('search'); $('#menuBtn').innerHTML = ic('more'); $('#backBtn').innerHTML = ic('chevL');
  $('#infoBtn').innerHTML = ic('info');
  $('#fab').innerHTML = ic('plus') + 'Capturar';
  aplicarCalma();
  render();
  if (datosDanados) setTimeout(() => dialogo({ titulo:'Tus datos guardados estaban dañados', texto:`No se borraron: quedaron apartados en este dispositivo (${datosDanados}). Si tienes tu hoja de Google conectada, vuelve a conectarla para recuperarlos.`, ok:'Entendido' }), 600);
  if (!pref.v('onb')) abrirOnb();
  else if (q.get('capturar')) abrirSheet({ k:'captura' });
  setInterval(tic, 500);
  setInterval(() => { if (document.visibilityState === 'visible' && !syncing) sincronizar(false); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tic(); sincronizar(false); if (T().corriendo) pantallaActiva(true); } else guardarYa(); });
  addEventListener('online', () => sincronizar(false));
  addEventListener('pagehide', guardarYa);
  addEventListener('resize', () => { if (ui.view === 'tablero') ajustarBoard(); if (ui.view === 'agenda') { if (desk()) renderSemana(); else ajustarAgenda(); } });
  mqDesk.addEventListener('change', () => render());
  mqMovil.addEventListener('change', () => { if (mqMovil.matches && ui.view === 'tablero') ir('lista'); else render(); });
  document.addEventListener('touchend', audioListo, { once:true });
  sincronizar(false);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
arrancar();
